<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国产 GPU 独角兽上市潮 - 知识卡片画廊</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --card-bg: #2d2d2d;
            --accent-color: #64ffda;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        h1 {
            color: var(--accent-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p.subtitle {
            font-size: 1.2rem;
            color: #888;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            justify-items: center;
        }
        .card-wrapper {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            width: 100%;
            max-width: 450px;
        }
        .card-wrapper:hover {
            transform: translateY(-5px);
        }
        .card-title {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #fff;
            font-weight: bold;
        }
        img.preview-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            cursor: zoom-in;
            transition: opacity 0.2s;
        }
        img.preview-img:hover {
            opacity: 0.9;
        }
        .actions {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #333;
            color: var(--accent-color);
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: background-color 0.2s;
            border: 1px solid var(--accent-color);
        }
        .btn:hover {
            background-color: rgba(100, 255, 218, 0.1);
        }
        footer {
            text-align: center;
            margin-top: 60px;
            color: #666;
            font-size: 0.9rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90vh;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .modal-caption {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            text-align: center;
            color: #ccc;
            padding: 10px 0;
            height: 150px;
        }
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }
        .close:hover,
        .close:focus {
            color: var(--accent-color);
            text-decoration: none;
            cursor: pointer;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>国产 GPU 独角兽上市潮</h1>
            <p class="subtitle">深度解析行业现状与挑战 • 知识卡片系列</p>
        </header>

        <div class="gallery">
            <!-- 卡片 1 -->
            <div class="card-wrapper">
                <div class="card-title">01. 上市潮背景与动机</div>
                <img src="./card_gpu_1_ipo_wave.svg" alt="上市潮背景" class="preview-img" onclick="openModal(this)">
                <div class="actions">
                    <a href="./card_gpu_1_ipo_wave.svg" download class="btn">下载 SVG</a>
                    <a href="https://svg.zhanglearning.com/" target="_blank" class="btn">转为 PNG</a>
                </div>
            </div>

            <!-- 卡片 2 -->
            <div class="card-wrapper">
                <div class="card-title">02. 估值倒挂与融资困境</div>
                <img src="./card_gpu_2_valuation_paradox.svg" alt="估值倒挂" class="preview-img" onclick="openModal(this)">
                <div class="actions">
                    <a href="./card_gpu_2_valuation_paradox.svg" download class="btn">下载 SVG</a>
                    <a href="https://svg.zhanglearning.com/" target="_blank" class="btn">转为 PNG</a>
                </div>
            </div>

            <!-- 卡片 3 -->
            <div class="card-wrapper">
                <div class="card-title">03. 技术与商业化挑战</div>
                <img src="./card_gpu_3_challenges.svg" alt="行业挑战" class="preview-img" onclick="openModal(this)">
                <div class="actions">
                    <a href="./card_gpu_3_challenges.svg" download class="btn">下载 SVG</a>
                    <a href="https://svg.zhanglearning.com/" target="_blank" class="btn">转为 PNG</a>
                </div>
            </div>

            <!-- 卡片 4 -->
            <div class="card-wrapper">
                <div class="card-title">04. 未来展望与破局</div>
                <img src="./card_gpu_4_future.svg" alt="未来展望" class="preview-img" onclick="openModal(this)">
                <div class="actions">
                    <a href="./card_gpu_4_future.svg" download class="btn">下载 SVG</a>
                    <a href="https://svg.zhanglearning.com/" target="_blank" class="btn">转为 PNG</a>
                </div>
            </div>
        </div>

        <footer>
            <p>© 2025 老章 • Generated by AI Assistant</p>
        </footer>
    </div>

    <!-- The Modal -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImg">
        <div id="caption" class="modal-caption"></div>
    </div>

    <script>
        function openModal(img) {
            var modal = document.getElementById("imageModal");
            var modalImg = document.getElementById("modalImg");
            var captionText = document.getElementById("caption");
            
            modal.style.display = "block";
            modalImg.src = img.src;
            captionText.innerHTML = img.alt;
        }

        function closeModal() {
            var modal = document.getElementById("imageModal");
            modal.style.display = "none";
        }

        // Close on Esc key
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeModal();
            }
        });
    </script>
</html>
