<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 画布背景 -->
  <rect width="900" height="1200" fill="#0f0f1a"/>
  
  <!-- 装饰圆 -->
  <circle cx="800" cy="100" r="110" fill="#fb923c" opacity="0.08"/>
  <circle cx="100" cy="1100" r="170" fill="#fbbf24" opacity="0.05"/>
  
  <!-- 顶部标签 -->
  <rect x="40" y="40" width="180" height="36" rx="18" fill="url(#headerGrad)"/>
  <text x="130" y="64" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">2026 跨年演讲</text>
  
  <!-- 系列标识 -->
  <text x="860" y="64" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#666" text-anchor="end">4/6</text>
  
  <!-- 主标题区 -->
  <text x="40" y="130" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="42" fill="#ffffff" font-weight="700">下一代怎么办？</text>
  <text x="40" y="170" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" fill="#888">逃离一致性，发明独特的自己</text>
  
  <!-- 核心洞见区块 -->
  <rect x="40" y="210" width="820" height="170" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="210" width="6" height="170" rx="3" fill="#fb923c"/>
  <text x="70" y="255" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#fb923c">🎓 教育面临的挑战</text>
  <foreignObject x="70" y="275" width="760" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:20px; line-height:1.7; color:#b8b8cc; text-align:justify;">
      以AI时代的变化速度，"哪个专业还安全"已经不可能有好答案。人类知识和经验垒起的护城河，正在迅速被技术填平。<span style="color:#fb923c; font-weight:600;">就算还有什么好专业，保质期也不超过3年。</span>
    </div>
  </foreignObject>
  
  <!-- 案例亮点 -->
  <rect x="40" y="400" width="820" height="155" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="400" width="6" height="155" rx="3" fill="#22c55e"/>
  <text x="70" y="445" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#22c55e">👤 曹德智的故事</text>
  <foreignObject x="70" y="465" width="760" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:19px; line-height:1.65; color:#b8b8cc;">
      普通二本毕业，做过蛋糕师、二手房中介。现在做微缩老房子复原——自己发明的职业：<span style="color:#22c55e; font-weight:600;">"微场景设计师"</span>。他定义了一个独特的问题，找到了有需求的场景，研发出可定价的产品。
    </div>
  </foreignObject>
  
  <!-- 核心策略 -->
  <rect x="40" y="575" width="820" height="200" rx="16" fill="#232340"/>
  <rect x="40" y="575" width="6" height="200" rx="3" fill="#fbbf24"/>
  <text x="70" y="620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#fbbf24">🚀 逃离一致性的三个方法</text>
  <foreignObject x="70" y="640" width="760" height="125">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:19px; line-height:1.8; color:#b8b8cc;">
      <div style="margin-bottom:6px;">1️⃣ 让孩子接触<span style="color:#fff; font-weight:500;">多种多样的人</span></div>
      <div style="margin-bottom:6px;">2️⃣ 让孩子交付<span style="color:#fff; font-weight:500;">明确的结果</span>（而不是答案）</div>
      <div>3️⃣ 让孩子带着<span style="color:#fff; font-weight:500;">独特的规则</span>和真实的世界打交道</div>
    </div>
  </foreignObject>
  
  <!-- 金句引用 -->
  <rect x="40" y="795" width="820" height="180" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="795" width="6" height="180" rx="3" fill="#ffd166"/>
  <text x="70" y="845" font-family="Georgia, serif" font-size="48" fill="#ffd166" opacity="0.5">"</text>
  <foreignObject x="100" y="830" width="720" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:22px; line-height:1.6; color:#e0e0e0; font-style:italic;">
      未来的孩子，一生的使命，就是要<span style="color:#fb923c; font-weight:600;">发明一个全世界只有我最胜任的职业</span>。
    </div>
  </foreignObject>
  <text x="760" y="955" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#888" text-anchor="end">— 罗振宇</text>
  
  <!-- 诗人名言 -->
  <rect x="40" y="995" width="820" height="60" rx="10" fill="#1c1c2e"/>
  <foreignObject x="60" y="1007" width="780" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:16px; line-height:1.5; color:#888; text-align:center; font-style:italic;">
      "月亮不知道自己是月亮，沙子不知道自己是沙子，每个事物都不了解自己独特的模样。" — 博尔赫斯
    </div>
  </foreignObject>
  
  <!-- 页脚 -->
  <rect x="0" y="1080" width="900" height="120" fill="#15152a"/>
  <text x="40" y="1120" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" fill="#ffffff" font-weight="600">罗振宇「时间的朋友」</text>
  <text x="40" y="1150" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#666">2025年12月31日 · 三亚 · 主题：1000天后的世界</text>
  
  <!-- 页脚右侧logo区域 -->
  <rect x="720" y="1100" width="140" height="50" rx="8" fill="#1c1c2e"/>
  <text x="790" y="1132" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#fb923c" text-anchor="middle">得到 · 跨年演讲</text>
</svg>
