    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:19px; line-height:1.6; color:#b8b8cc; font-family:-apple-system, PingFang SC, sans-serif;">
      <span style="color:#22c55e;">Alpamayo</span> + <span style="color:#4ade80;">经典AV护栏</span> + <span style="color:#ffd166;">策略评估器</span>，世界唯一双堆栈AV
    </div>
  </foreignObject>
  <rect x="40" y="935" width="820" height="100" rx="16" fill="#232340"/>
  <rect x="40" y="935" width="6" height="100" rx="3" fill="#ffd166"/>
  <text x="70" y="975" font-size="36" fill="#ffd166" opacity="0.6" font-family="Georgia, serif">"</text>
  <foreignObject x="95" y="960" width="730" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.5; color:#e0e0e0; font-style:italic; font-family:-apple-system, PingFang SC, sans-serif;">
      梅赛德斯CLA，NCAP评为世界最安全汽车。Alpamayo今日开源！
    </div>
