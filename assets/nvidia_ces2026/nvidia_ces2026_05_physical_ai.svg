  <foreignObject x="70" y="455" width="350" height="90">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:17px; line-height:1.55; color:#b8b8cc; font-family:-apple-system, PingFang SC, sans-serif;">
      理解世界如何运作，<span style="color:#4ade80; font-weight:600;">将计算转化为数据</span>
    </div>
