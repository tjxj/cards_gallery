      <span style="color:#22c55e; font-weight:600;">1. 训练计算机</span> → <span style="color:#22c55e; font-weight:600;">2. 推理计算机</span>（机器人中）→ <span style="color:#22c55e; font-weight:600;">3. 模拟计算机</span>（Omniverse）
    </div>
  </foreignObject>
