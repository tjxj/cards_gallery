<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="#0f0f1a"/>
  <circle cx="800" cy="80" r="120" fill="#22c55e" opacity="0.08"/>
  <circle cx="100" cy="1100" r="180" fill="#4ade80" opacity="0.05"/>
  <rect x="40" y="40" width="820" height="140" rx="20" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="70" y="95" font-size="18" fill="#0f0f1a" opacity="0.8" font-family="-apple-system, PingFang SC, sans-serif">NVIDIA CES 2026 主题演讲</text>
  <text x="70" y="140" font-size="36" font-weight="700" fill="#0f0f1a" font-family="-apple-system, PingFang SC, sans-serif">物理AI与自动驾驶</text>
  <text x="780" y="95" font-size="14" fill="#0f0f1a" opacity="0.7" text-anchor="end" font-family="-apple-system, PingFang SC, sans-serif">Jensen Huang</text>
