<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1700" width="900" height="1700">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a15;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="1700" fill="url(#bgGrad)"/>
  <circle cx="820" cy="70" r="160" fill="#fb923c" opacity="0.05"/>
  <circle cx="80" cy="1600" r="200" fill="#f59e0b" opacity="0.04"/>
  <rect x="0" y="0" width="900" height="6" fill="url(#headerGrad)"/>

  <rect x="40" y="25" width="220" height="32" rx="16" fill="#fb923c" opacity="0.15"/>
  <text x="150" y="47" font-size="14" fill="#fb923c" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-weight="500">🏃 个人如何不掉队</text>

  <foreignObject x="40" y="70" width="820" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:36px; line-height:1.3; color:#ffffff; font-weight:700; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif;">
      个人在这个时代如何不掉队
    </div>
  </foreignObject>

  <!-- 核心趋势 -->
  <rect x="40" y="160" width="820" height="70" rx="12" fill="#fb923c" opacity="0.08"/>
  <foreignObject x="60" y="168" width="780" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:22px; line-height:1.5; color:#fb923c; font-weight:700; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif; text-align:center;">
      ⚡ 核心趋势：AI在吞噬工具，也在吞噬工具人
    </div>
  </foreignObject>

  <!-- 路径1：大厂 -->
  <rect x="40" y="255" width="820" height="280" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="255" width="6" height="280" rx="3" fill="#1a73e8"/>
  <text x="70" y="290" font-size="22" fill="#1a73e8" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">🏢 路径一：在大厂</text>
  <foreignObject x="70" y="305" width="760" height="220">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.7; color:#b8b8cc; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif;">
      <div style="margin-bottom:10px;">
        大厂不再像以前那样倾向于招那么多人了，<span style="color:#1a73e8; font-weight:600;">会招更少的人</span>。
      </div>
      <div style="padding:8px 12px; background:#232340; border-radius:8px; margin-bottom:10px; font-size:16px;">
        💡 大部分人做的事情其实非常单薄。我们应该让<span style="color:#ffd166; font-weight:600;">AI帮做那些机械性的工作，自己去做更有价值的事情</span>。
      </div>
      <div style="margin-bottom:8px;">
        🎯 <span style="color:#1a73e8; font-weight:600;">关键：进到核心业务里去</span>
      </div>
      <div style="font-size:16px; color:#888;">
        还可以做side project——看AI信息、自己build产品、做一个有规模的AI产品，这三个层次对人的认知要求完全不一样。
      </div>
      <div style="margin-top:8px; font-size:15px; color:#fb923c;">
        城市选择：深圳偏AI硬件，杭州偏AI做生意，上海偏大AI业务，北京偏模型和应用
      </div>
    </div>
  </foreignObject>

  <!-- 路径2：AI初创公司 -->
  <rect x="40" y="555" width="820" height="310" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="555" width="6" height="310" rx="3" fill="#a855f7"/>
  <text x="70" y="590" font-size="22" fill="#a855f7" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">🚀 路径二：AI初创公司</text>
  <foreignObject x="70" y="605" width="760" height="250">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.7; color:#b8b8cc; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif;">
      <div style="margin-bottom:10px;">判断AI初创公司的标准：</div>
      <div style="padding:8px 12px; background:#232340; border-radius:8px; margin-bottom:8px; font-size:16px;">
        <span style="color:#a855f7; font-weight:600;">第一个：有没有提供无限量的token？</span><br/>
        <span style="color:#888;">没有 → 不是AI native。AI native公司token可以转化为效益，所以愿意提供。</span>
      </div>
      <div style="padding:8px 12px; background:#232340; border-radius:8px; margin-bottom:8px; font-size:16px;">
        <span style="color:#a855f7; font-weight:600;">第二个：梯子挂了，能不能正常运行？</span><br/>
        <span style="color:#888;">不能 → 非常AI native的公司。</span>
      </div>
      <div style="margin-top:8px; font-size:16px; color:#888;">
        <span style="color:#ffd166; font-weight:600;">人的介绍很重要</span>，因为在更不确定的更开放的阶段，对人品和综合素质要求更高。GitHub主页或side project可能比简历更重要。
      </div>
    </div>
  </foreignObject>

  <!-- 路径3：融资 -->
  <rect x="40" y="885" width="820" height="180" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="885" width="6" height="180" rx="3" fill="#22c55e"/>
  <text x="70" y="920" font-size="22" fill="#22c55e" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">💰 路径三：融资</text>
  <foreignObject x="70" y="935" width="760" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.7; color:#b8b8cc; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif;">
      <div style="margin-bottom:8px;">
        Founder的核心工作：<span style="color:#22c55e; font-weight:600;">找钱、找人、找方向、为团队降噪</span>
      </div>
      <div>
        <span style="color:#ffd166; font-weight:600;">如果要选，一定要出海</span>。国内人穷企业穷，大厂又太强。出海这个世界很大。能拿美元拿美元一，国内有些VC的钱附带比较苛刻的条款，本质是债不是投资。
      </div>
    </div>
  </foreignObject>

  <!-- 路径4：一人公司 -->
  <rect x="40" y="1085" width="820" height="380" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="1085" width="6" height="380" rx="3" fill="#fb923c"/>
  <text x="70" y="1120" font-size="22" fill="#fb923c" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">🧑‍💻 路径四：一人公司——小而美的可能</text>
  <foreignObject x="70" y="1135" width="760" height="320">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.7; color:#b8b8cc; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif;">
      <div style="padding:8px 12px; background:#232340; border-radius:8px; margin-bottom:10px; font-size:16px;">
        <span style="color:#fb923c; font-weight:600;">首先你要有build的能力</span>。Vibe coding + 工程化是必须掌握的基本技能。
      </div>
      <div style="margin-bottom:10px;">
        有了这个能力，你可以做一些小生意——有很多小需求，对公司来说不值得做，但对个人来说<span style="color:#fb923c; font-weight:600;">月赚几千到1万美金</span>。
      </div>
      <div style="margin-bottom:10px;">
        具体形态：<span style="color:#888;">小工具、小插件、AI工具导航站接Google Ads赚广告钱</span>
      </div>
      <div style="padding:8px 12px; background:#232340; border-radius:8px; margin-bottom:10px; font-size:16px;">
        <span style="color:#ffd166; font-weight:600;">品牌和自媒体非常重要</span>。AI coding起来之后，工具门槛极低，两三天就能复刻你的APP。为什么人家用你的？因为你有品牌。
      </div>
      <div style="font-size:16px; color:#888;">
        Agent盈利目前困难，但<span style="color:#22c55e; font-weight:600;">趋势向好</span>。Token成本在下降，三年来百万token的成本下降了多少大家有目共睹。
      </div>
    </div>
  </foreignObject>

  <!-- 意料之外的规律 -->
  <rect x="40" y="1490" width="820" height="100" rx="16" fill="#232340"/>
  <rect x="40" y="1490" width="820" height="3" rx="1" fill="url(#headerGrad)"/>
  <foreignObject x="60" y="1505" width="780" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:19px; line-height:1.7; color:#e0e0e0; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif; text-align:center;">
      🧠 <span style="color:#ffd166; font-weight:700;">有意思的规律</span>：当你做的事情你不擅长时，你会更加依赖AI；<br/>当你做的事情你很熟练，你就会觉得AI不大行。<span style="color:#fb923c; font-weight:600;">要让自己进入不舒适区。</span>
    </div>
  </foreignObject>

  <!-- 页脚 -->
  <rect x="0" y="1615" width="900" height="85" fill="#15152a"/>
  <text x="40" y="1655" font-size="14" fill="#666" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">来源：Kenny肯尼 · 2026年AI趋势观察</text>
  <text x="860" y="1655" font-size="16" fill="#666" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">4/5</text>
</svg>
