<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a15;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="1600" fill="url(#bgGrad)"/>
  <circle cx="800" cy="80" r="180" fill="#a855f7" opacity="0.05"/>
  <circle cx="100" cy="1500" r="200" fill="#6366f1" opacity="0.04"/>
  <rect x="0" y="0" width="900" height="6" fill="url(#headerGrad)"/>

  <rect x="40" y="25" width="200" height="32" rx="16" fill="#a855f7" opacity="0.15"/>
  <text x="140" y="47" font-size="14" fill="#a855f7" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-weight="500">🗺️ 应用层机会地图</text>

  <!-- 标题 -->
  <foreignObject x="40" y="70" width="820" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:36px; line-height:1.3; color:#ffffff; font-weight:700; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif;">
      应用层的三大赛道与机会
    </div>
  </foreignObject>

  <!-- 赛道1：生产力Agent -->
  <rect x="40" y="170" width="820" height="380" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="170" width="820" height="50" rx="16" fill="#a855f7" opacity="0.1"/>
  <rect x="40" y="204" width="820" height="1" fill="#1c1c2e"/>
  <text x="70" y="203" font-size="22" fill="#a855f7" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">🤖 赛道一：生产力Agent（主赛道）</text>

  <foreignObject x="60" y="230" width="780" height="310">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.7; color:#b8b8cc; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif;">
      <div style="margin-bottom:12px;">
        <span style="color:#a855f7; font-weight:600;">垂直场景Agent</span>
        <span style="color:#888;"> — 最大机会！不同行业差距极大</span>
      </div>
      <div style="padding:8px 12px; background:#232340; border-radius:8px; margin-bottom:12px; font-size:16px; color:#e0e0e0;">
        💼 帮金融、律师行业装Claude Code，把文档文本任务按需求让Claude去干——结果是真的<span style="color:#ef4444; font-weight:600;">震惊</span>，他们开始认真思考怎么裁员了
      </div>
      <div style="margin-bottom:12px;">
        <span style="color:#a855f7; font-weight:600;">Agent基建</span>
        <span style="color:#888;"> — 为agent服务的基础设施快速起来</span>
      </div>
      <div style="font-size:16px; color:#888; margin-bottom:6px;">具体需求：</div>
      <div style="font-size:16px; color:#b8b8cc; padding-left:12px;">
        • 怎么给agent提供数据（API vs 爬虫）<br/>
        • 怎么提供更好的工具<br/>
        • 怎么处理context<br/>
        • 怎么做memory
      </div>
      <div style="margin-top:12px; padding:8px 12px; background:#232340; border-radius:8px; font-size:15px;">
        <span style="color:#ffd166;">被Agent搜到（GEO）→ 被Agent用到</span>
        <span style="color:#888;"> — SEO的新时代</span>
      </div>
    </div>
  </foreignObject>

  <!-- 赛道2：AI互动平台 -->
  <rect x="40" y="570" width="820" height="340" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="570" width="820" height="50" rx="16" fill="#6366f1" opacity="0.1"/>
  <rect x="40" y="604" width="820" height="1" fill="#1c1c2e"/>
  <text x="70" y="603" font-size="22" fill="#6366f1" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">🎮 赛道二：AI互动平台</text>

  <foreignObject x="60" y="630" width="780" height="270">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.7; color:#b8b8cc; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif;">
      <div style="margin-bottom:12px;">
        <span style="color:#6366f1; font-weight:600;">消费侧的增量</span>
        <span style="color:#888;"> — 更大的机会在消费侧</span>
      </div>
      <div style="margin-bottom:12px;">
        <span style="color:#6366f1; font-weight:600;">多模态生成线</span>：技术门槛消失后，产能爆炸
      </div>
      <div style="padding:8px 12px; background:#232340; border-radius:8px; margin-bottom:12px; font-size:16px; color:#e0e0e0;">
        🎬 <span style="color:#ffd166; font-weight:600;">小作坊也能做出电视剧和电影级别的内容了</span>。短剧市场规模破千亿，电影这么多年只有500亿。
      </div>
      <div style="font-size:17px; color:#b8b8cc;">
        真正让电影级的内容走向<span style="color:#6366f1; font-weight:600;">碎片化和去中心化</span>。但现代人已经越来越无法集中注意力了——甚至连电影学院的学生都没办法坐在教室里看完一整部电影。
      </div>
      <div style="margin-top:12px; font-size:16px; color:#888;">
        最终受益的：做供给、分发、消费的<span style="color:#6366f1;">内容平台</span>
      </div>
    </div>
  </foreignObject>

  <!-- 赛道3：AI硬件 -->
  <rect x="40" y="930" width="820" height="310" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="930" width="820" height="50" rx="16" fill="#fb923c" opacity="0.1"/>
  <rect x="40" y="964" width="820" height="1" fill="#1c1c2e"/>
  <text x="70" y="963" font-size="22" fill="#fb923c" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">⚡ 赛道三：AI硬件</text>

  <foreignObject x="60" y="990" width="780" height="240">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.7; color:#b8b8cc; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif;">
      <div style="margin-bottom:12px;">
        <span style="color:#fb923c; font-weight:600;">信息采集硬件</span>：帮你收集真实生活的context
      </div>
      <div style="font-size:16px; color:#888; margin-bottom:12px;">
        • 可穿戴设备把context记录下来给agent分析<br/>
        • OdyssLife——一个项链，有摄像头，拍摄你吃饭的内容做营养分析
      </div>
      <div style="margin-bottom:12px;">
        <span style="color:#fb923c; font-weight:600;">展示和交互硬件</span>：智能镜子、客厅屏幕、挂画等
      </div>
      <div style="padding:8px 12px; background:#232340; border-radius:8px; font-size:16px; color:#ffd166; font-weight:600;">
        🔑 AI硬件的门槛和机会：做AI的不懂硬件，做硬件的不懂AI。两者结合有天然的壁垒。
      </div>
      <div style="margin-top:8px; font-size:15px; color:#888;">
        深圳在中国，出海做AI硬件有天然优势
      </div>
    </div>
  </foreignObject>

  <!-- 关键认知 -->
  <rect x="40" y="1270" width="820" height="120" rx="16" fill="#232340"/>
  <rect x="40" y="1270" width="820" height="3" rx="1" fill="url(#headerGrad)"/>
  <foreignObject x="60" y="1285" width="780" height="95">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.7; color:#e0e0e0; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif; text-align:center;">
      ⚠️ <span style="font-weight:700; color:#ffffff;">关键认知：不同行业之间的差距极大</span><br/>
      <span style="color:#a855f7;">Coding领域agent已经极强</span>，但很多传统行业连基建都没有。<span style="color:#ffd166;">信息差意味着很多机会。</span>
    </div>
  </foreignObject>

  <!-- 价格模式变化 -->
  <rect x="40" y="1415" width="820" height="90" rx="12" fill="#1c1c2e"/>
  <rect x="40" y="1415" width="6" height="90" rx="3" fill="#22c55e"/>
  <foreignObject x="70" y="1425" width="760" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:17px; line-height:1.7; color:#b8b8cc; font-family:-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif;">
      💰 定价逻辑转变：<span style="color:#22c55e; font-weight:600;">几千美刀其实是人的逻辑</span>——如果你觉得它是工具，50刀好贵；但如果是一个人在帮你干活，100刀200刀都不贵。
    </div>
  </foreignObject>

  <!-- 页脚 -->
  <rect x="0" y="1520" width="900" height="80" fill="#15152a"/>
  <text x="40" y="1555" font-size="14" fill="#666" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">来源：Kenny肯尼 · 2026年AI趋势观察</text>
  <text x="860" y="1555" font-size="16" fill="#666" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">3/5</text>
</svg>
