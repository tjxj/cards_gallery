<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="1200" fill="#0f0f1a"/>
  
  <!-- 装饰圆 -->
  <circle cx="800" cy="110" r="140" fill="#14b8a6" opacity="0.08"/>
  <circle cx="100" cy="1090" r="190" fill="#0ea5e9" opacity="0.05"/>
  
  <!-- 头部 -->
  <rect x="40" y="40" width="820" height="140" rx="20" fill="url(#headerGrad3)" filter="url(#shadow)"/>
  <text x="70" y="110" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="38" font-weight="700" fill="#ffffff">⚡ 凡人 vs 不朽</text>
  <text x="70" y="150" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" fill="#a7f3d0">两种计算范式的根本差异</text>
  
  <!-- 区块1：关键区别 -->
  <rect x="40" y="210" width="820" height="220" rx="16" fill="#232340"/>
  <rect x="40" y="210" width="6" height="220" rx="3" fill="#ffd166"/>
  <text x="70" y="250" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" font-weight="600" fill="#ffd166">🔑 核心差异：权重的可迁移性</text>
  <foreignObject x="70" y="265" width="760" height="150">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:20px; line-height:1.65; color:#e0e0e0; text-align:justify; word-wrap:break-word;">
      <strong style="color:#ffd166;">数字计算：</strong>可以在不同硬件上运行同一程序，权重是不朽的。摧毁所有电脑，只要保存权重，就能在新电脑上复活。<br/>
      <strong style="color:#ffd166;">生物计算：</strong>每个人的神经元和连接方式都不同。你的连接强度对我没用——我们是凡人，硬件死亡，知识随之死亡。
    </div>
  </foreignObject>
  
  <!-- 对比表格 -->
  <rect x="40" y="460" width="400" height="320" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="460" width="6" height="320" rx="3" fill="#22c55e"/>
  <text x="70" y="500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#22c55e">💻 数字智能</text>
  <foreignObject x="70" y="510" width="350" height="255">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:18px; line-height:1.6; color:#b8b8cc;">
      ✅ <strong style="color:#22c55e;">不朽</strong>：权重永久保存<br/>
      ✅ <strong style="color:#22c55e;">高效传递</strong>：瞬间传输数十亿比特<br/>
      ✅ <strong style="color:#22c55e;">并行学习</strong>：1万个智能体各学一课，平均权重后全都会<br/>
      ❌ <strong style="color:#ef4444;">高能耗</strong><br/>
      ❌ <strong style="color:#ef4444;">硬件难造</strong>（台积电精密制造）
    </div>
  </foreignObject>
  
  <rect x="460" y="460" width="400" height="320" rx="16" fill="#1c1c2e"/>
  <rect x="460" y="460" width="6" height="320" rx="3" fill="#ef4444"/>
  <text x="490" y="500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#ef4444">🧠 生物智能</text>
  <foreignObject x="490" y="510" width="350" height="255">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:18px; line-height:1.6; color:#b8b8cc;">
      ✅ <strong style="color:#22c55e;">低能耗</strong><br/>
      ✅ <strong style="color:#22c55e;">易制造</strong>（廉价"生长"）<br/>
      ❌ <strong style="color:#ef4444;">凡人</strong>：必死于硬件损坏<br/>
      ❌ <strong style="color:#ef4444;">传递低效</strong>：靠语言，每句话仅~100比特<br/>
      ❌ <strong style="color:#ef4444;">必须听讲座</strong>：蒸馏式知识传递
    </div>
  </foreignObject>
  
  <!-- 惊人结论 -->
  <rect x="40" y="810" width="820" height="200" rx="16" fill="#232340"/>
  <rect x="40" y="810" width="6" height="200" rx="3" fill="#0ea5e9"/>
  <text x="70" y="850" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" font-weight="600" fill="#0ea5e9">💡 惊人的结果</text>
  <foreignObject x="70" y="865" width="760" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:20px; line-height:1.65; color:#e0e0e0; text-align:justify; word-wrap:break-word;">
      为什么 GPT-4 的连接数只有你的 <strong style="color:#0ea5e9;">1%</strong>，却知道的比你多 <strong style="color:#0ea5e9;">几千倍</strong>？因为它可以让 1 万个副本分别学习不同知识，然后<strong style="color:#0ea5e9;">直接平均权重</strong>——所有副本瞬间全知全能。人类永远做不到这一点。
    </div>
  </foreignObject>
  
  <!-- 页脚 -->
  <rect x="0" y="1120" width="900" height="80" fill="#15152a"/>
  <text x="40" y="1165" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#666">AI教父辛顿 · 霍巴特演讲 2026.01.07</text>
  <text x="860" y="1165" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#666" text-anchor="end">3/6</text>
</svg>
