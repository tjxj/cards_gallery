<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="1400" fill="#0f0f1a"/>
  
  <!-- 装饰元素 -->
  <circle cx="800" cy="120" r="180" fill="#f97316" opacity="0.06"/>
  <circle cx="100" cy="1300" r="150" fill="#fbbf24" opacity="0.04"/>
  
  <!-- 系列标识 -->
  <rect x="40" y="40" width="200" height="36" rx="18" fill="#f97316" opacity="0.15"/>
  <text x="60" y="65" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#f97316">🔥 行为改变心理学</text>
  
  <!-- 主标题 -->
  <foreignObject x="40" y="100" width="820" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:38px; font-weight:800; line-height:1.3; color:#ffffff;">
      观点一：<span style="color:#f97316;">身份先于行为</span>
    </div>
  </foreignObject>
  
  <!-- 核心论点 -->
  <rect x="40" y="220" width="820" height="140" rx="20" fill="#1c1c2e"/>
  <rect x="40" y="220" width="8" height="140" rx="4" fill="#f97316"/>
  <foreignObject x="75" y="245" width="760" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:22px; line-height:1.7; color:#ffffff; text-align:justify;">
      你不在想去的地方，是因为你<span style="color:#f97316; font-weight:700;">还不是会在那里的人</span>。大多数人试图在腐烂的地基上建造美好生活。
    </div>
  </foreignObject>
  
  <!-- 两种方式对比 -->
  <text x="40" y="410" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#888">成功的两个要素：</text>
  
  <rect x="40" y="440" width="400" height="200" rx="16" fill="#2a1f1f"/>
  <rect x="40" y="440" width="6" height="200" rx="3" fill="#ef4444"/>
  <text x="70" y="485" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#ef4444">❌ 二阶变化（最不重要）</text>
  <foreignObject x="70" y="505" width="350" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:17px; line-height:1.7; color:#b8b8cc;">
      改变行为来向目标进步<br/>
      <span style="color:#666; font-size:15px;">→ 设定表面目标<br/>→ 靠意志力坚持几周<br/>→ 回到老样子</span>
    </div>
  </foreignObject>
  
  <rect x="460" y="440" width="400" height="200" rx="16" fill="#1f2a1f"/>
  <rect x="460" y="440" width="6" height="200" rx="3" fill="#22c55e"/>
  <text x="490" y="485" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#22c55e">✓ 一阶变化（最重要）</text>
  <foreignObject x="490" y="505" width="350" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:17px; line-height:1.7; color:#e0e0e0;">
      改变你是谁，行为自然跟随<br/>
      <span style="color:#888; font-size:15px;">→ 转变身份认同<br/>→ 新行为变得自然<br/>→ 无法想象其他活法</span>
    </div>
  </foreignObject>
  
  <!-- 案例研究 -->
  <rect x="40" y="670" width="820" height="280" rx="20" fill="#1c1c2e"/>
  <rect x="40" y="670" width="8" height="280" rx="4" fill="#a855f7"/>
  <text x="75" y="715" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#a855f7">🔬 真相揭示</text>
  
  <foreignObject x="75" y="740" width="760" height="200">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:18px; line-height:1.85; color:#b8b8cc;">
      <div style="margin-bottom:12px;"><span style="color:#fbbf24; font-weight:600;">🏋️ 健身达人：</span>不需要「自律」才能健康饮食——他们<span style="color:#22c55e;">需要自律才能吃垃圾食品</span></div>
      <div style="margin-bottom:12px;"><span style="color:#fbbf24; font-weight:600;">💼 成功CEO：</span>不需要逼自己早起工作——他们<span style="color:#22c55e;">讨厌赖床浪费时间</span></div>
      <div><span style="color:#fbbf24; font-weight:600;">✍️ 作者本人：</span>「如果我不享受，我为什么要做我正在做的事？」当妈妈说该休息时，他觉得工作就是休息</div>
    </div>
  </foreignObject>
  
  <!-- 关键引用 -->
  <rect x="40" y="980" width="820" height="180" rx="20" fill="#232340"/>
  <rect x="40" y="980" width="8" height="180" rx="4" fill="#ffd166"/>
  <text x="75" y="1025" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="40" fill="#ffd166" opacity="0.5">"</text>
  <foreignObject x="90" y="1015" width="740" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:20px; line-height:1.65; color:#e0e0e0; font-style:italic;">
      如果你想要特定的人生结果，你必须<span style="color:#ffd166; font-weight:600;">在达到目标之前很久</span>就拥有能创造那个结果的生活方式。
    </div>
  </foreignObject>
  
  <!-- 警告 -->
  <rect x="40" y="1190" width="820" height="80" rx="16" fill="#2a1f1f"/>
  <foreignObject x="75" y="1210" width="760" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:18px; line-height:1.5; color:#ef4444; text-align:center;">
      ⚠️ 「我等不及减完肥就可以享受生活了」= 注定失败的信号
    </div>
  </foreignObject>
  
  <!-- 页脚 -->
  <rect x="0" y="1300" width="900" height="100" fill="#15152a"/>
  <text x="70" y="1345" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" fill="#666666">来源：Dan Koe · 行为改变的7个核心观点</text>
  <text x="70" y="1375" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#555555">整理 @老章mlpy · 2026年1月</text>
  <rect x="800" y="1320" width="60" height="50" rx="12" fill="#f97316" opacity="0.15"/>
  <text x="830" y="1353" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" fill="#f97316" font-weight="700" text-anchor="middle">2/8</text>
</svg>
