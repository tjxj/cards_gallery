<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="1600" fill="#0f0f1a"/>
  <circle cx="800" cy="120" r="180" fill="#f472b6" opacity="0.06"/>
  <circle cx="100" cy="1500" r="160" fill="#ec4899" opacity="0.04"/>
  
  <rect x="40" y="40" width="200" height="36" rx="18" fill="#f472b6" opacity="0.15"/>
  <text x="60" y="65" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#f472b6">🧠 行为改变心理学</text>
  
  <foreignObject x="40" y="100" width="820" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:38px; font-weight:800; line-height:1.3; color:#ffffff;">
      观点三：<span style="color:#f472b6;">身份保护机制</span>
    </div>
  </foreignObject>
  
  <rect x="40" y="210" width="820" height="140" rx="20" fill="#232340"/>
  <rect x="40" y="210" width="8" height="140" rx="4" fill="#ffd166"/>
  <text x="75" y="250" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="36" fill="#ffd166" opacity="0.5">"</text>
  <foreignObject x="90" y="240" width="740" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:17px; line-height:1.65; color:#e0e0e0; font-style:italic;">
      如果你接受了一个想法并坚信它是真的，它就会对你产生与催眠师对被催眠者的话语相同的力量。
    </div>
  </foreignObject>
  <text x="760" y="330" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" fill="#888" text-anchor="end">— 麦克斯韦尔·马尔茨</text>
  
  <rect x="40" y="380" width="820" height="400" rx="20" fill="#1c1c2e"/>
  <rect x="40" y="380" width="8" height="400" rx="4" fill="#f472b6"/>
  <text x="75" y="425" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#f472b6">🔄 身份形成的8个步骤</text>
  
  <foreignObject x="75" y="450" width="760" height="320">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:17px; line-height:1.95; color:#b8b8cc;">
      <div><span style="color:#22c55e; font-weight:700;">①</span> 你想要达成一个目标</div>
      <div><span style="color:#22c55e; font-weight:700;">②</span> 你通过目标的滤镜感知现实</div>
      <div><span style="color:#22c55e; font-weight:700;">③</span> 你只注意到有助于目标的信息（学习）</div>
      <div><span style="color:#22c55e; font-weight:700;">④</span> 你行动并获得反馈</div>
      <div><span style="color:#22c55e; font-weight:700;">⑤</span> 重复直到自动化（条件反射）</div>
      <div><span style="color:#fbbf24; font-weight:700;">⑥</span> 成为「我是这种人」的一部分</div>
      <div><span style="color:#ef4444; font-weight:700;">⑦</span> 保护身份以维持心理一致性</div>
      <div><span style="color:#ef4444; font-weight:700;">⑧</span> 身份塑造新目标，循环重启...</div>
    </div>
  </foreignObject>
  
  <rect x="40" y="810" width="820" height="180" rx="20" fill="#232340"/>
  <rect x="40" y="810" width="8" height="180" rx="4" fill="#a855f7"/>
  <text x="75" y="855" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#a855f7">👶 从童年开始</text>
  <foreignObject x="75" y="880" width="760" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:17px; line-height:1.7; color:#b8b8cc;">
      你依赖父母教你生存。你必须顺从。除非采纳他们的信念，否则会被惩罚。<span style="color:#ef4444;">在你看穿这一点之前，你并没有真正为自己思考。</span>
    </div>
  </foreignObject>
  
  <rect x="40" y="1020" width="400" height="180" rx="16" fill="#2a1f1f"/>
  <text x="70" y="1065" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#ef4444">🏃 身体威胁</text>
  <foreignObject x="70" y="1085" width="350" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:16px; line-height:1.7; color:#b8b8cc;">
      身体感到威胁时<br/>→ 战斗或逃跑模式<br/>→ 本能接管
    </div>
  </foreignObject>
  
  <rect x="460" y="1020" width="400" height="180" rx="16" fill="#2a1f2f"/>
  <text x="490" y="1065" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#f472b6">🧠 身份威胁</text>
  <foreignObject x="490" y="1085" width="350" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:16px; line-height:1.7; color:#b8b8cc;">
      身份感到威胁时<br/>→ <span style="color:#f472b6;">同样战斗或逃跑！</span><br/>→ 陷入回音室、加倍固守
    </div>
  </foreignObject>
  
  <rect x="40" y="1230" width="820" height="120" rx="20" fill="#1c1c2e"/>
  <foreignObject x="75" y="1265" width="760" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:18px; line-height:1.6; color:#14b8a6; text-align:center; font-weight:600;">
      💡 物质生存满足后，你开始在概念层面「生存」——保护和繁殖思想
    </div>
  </foreignObject>
  
  <rect x="0" y="1480" width="900" height="120" fill="#15152a"/>
  <text x="70" y="1530" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" fill="#666666">来源：Dan Koe · 行为改变的7个核心观点</text>
  <text x="70" y="1560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#555555">整理 @老章mlpy · 2026年1月</text>
  <rect x="800" y="1505" width="60" height="50" rx="12" fill="#f472b6" opacity="0.15"/>
  <text x="830" y="1538" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" fill="#f472b6" font-weight="700" text-anchor="middle">4/8</text>
</svg>
