<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2000" width="900" height="2000">
  <rect width="900" height="2000" fill="#0f0f1a"/>
  <circle cx="800" cy="100" r="160" fill="#14b8a6" opacity="0.06"/>
  <circle cx="100" cy="1900" r="150" fill="#0ea5e9" opacity="0.04"/>
  
  <rect x="40" y="40" width="200" height="36" rx="18" fill="#14b8a6" opacity="0.15"/>
  <text x="60" y="65" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#14b8a6">⚡ 实操方法论</text>
  
  <foreignObject x="40" y="100" width="820" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:38px; font-weight:800; line-height:1.3; color:#ffffff;">
      观点六：<span style="color:#14b8a6;">一日重启协议</span>
    </div>
  </foreignObject>
  
  <!-- 三阶段流程 -->
  <rect x="40" y="210" width="820" height="80" rx="16" fill="#1c1c2e"/>
  <foreignObject x="70" y="230" width="760" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:18px; line-height:1.5; color:#b8b8cc; text-align:center;">
      <span style="color:#14b8a6; font-weight:600;">🌅 早晨</span> 挖掘心理 → <span style="color:#0ea5e9; font-weight:600;">☀️ 白天</span> 打断自动驾驶 → <span style="color:#6366f1; font-weight:600;">🌙 晚上</span> 整合洞察
    </div>
  </foreignObject>
  
  <!-- 三阶段说明 -->
  <rect x="40" y="310" width="820" height="100" rx="16" fill="#232340"/>
  <foreignObject x="70" y="335" width="760" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:16px; line-height:1.6; color:#888; text-align:center;">
      身份翻转的三个阶段：<span style="color:#ef4444;">不协调</span>（对现状极度不满）→ <span style="color:#fbbf24;">不确定</span>（不知道下一步）→ <span style="color:#22c55e;">发现</span>（6个月完成6年的进步）
    </div>
  </foreignObject>
  
  <!-- Part 1: 早晨 -->
  <rect x="40" y="440" width="820" height="520" rx="20" fill="#1c1c2e"/>
  <rect x="40" y="440" width="8" height="520" rx="4" fill="#14b8a6"/>
  <text x="75" y="485" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#14b8a6">🌅 Part 1：早晨 — 心理挖掘（15-30分钟）</text>
  
  <foreignObject x="75" y="515" width="760" height="430">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:16px; line-height:1.75; color:#b8b8cc;">
      <div style="color:#ef4444; font-weight:600; margin-bottom:8px;">反愿景问题（觉察痛苦）：</div>
      <div style="margin-bottom:4px;">① 你学会容忍的、持续的不满是什么？</div>
      <div style="margin-bottom:4px;">② 你反复抱怨却从不改变的三件事是什么？</div>
      <div style="margin-bottom:4px;">③ 对于每个抱怨：观察你行为的人会得出什么结论？</div>
      <div style="margin-bottom:4px;">④ 什么真相对你深敬的人说出来会让你难以承受？</div>
      <div style="margin-bottom:4px;">⑤ 如果5年后什么都没变，你的周二是什么样的？</div>
      <div style="margin-bottom:4px;">⑥ 10年后呢？你错过了什么？谁放弃了你？</div>
      <div style="margin-bottom:4px;">⑦ 谁已经在过你描述的未来？想到成为他们你有什么感觉？</div>
      <div style="margin-bottom:4px;">⑧ 你必须放弃什么身份才能真正改变？</div>
      <div style="margin-bottom:16px;">⑨ 你没有改变的最尴尬的原因是什么？</div>
      
      <div style="color:#22c55e; font-weight:600; margin-bottom:8px;">愿景问题（明确方向）：</div>
      <div style="margin-bottom:4px;">⑩ 3年后理想的周二是什么样的？（同样详细）</div>
      <div style="margin-bottom:4px;">⑪ 你必须相信什么才能让那种生活自然发生？</div>
      <div>⑫ 如果你已经是那个人，这周你会做什么？</div>
    </div>
  </foreignObject>
  
  <!-- Part 2: 白天 -->
  <rect x="40" y="990" width="820" height="420" rx="20" fill="#1c1c2e"/>
  <rect x="40" y="990" width="8" height="420" rx="4" fill="#0ea5e9"/>
  <text x="75" y="1035" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#0ea5e9">☀️ Part 2：白天 — 打断自动驾驶模式</text>
  
  <foreignObject x="75" y="1065" width="760" height="330">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:16px; line-height:1.75; color:#b8b8cc;">
      <div style="color:#0ea5e9; font-weight:600; margin-bottom:10px;">设置手机提醒，在这些时间问自己：</div>
      <div style="margin-bottom:5px;"><span style="color:#888;">11:00</span> — 我现在做这件事是在逃避什么？</div>
      <div style="margin-bottom:5px;"><span style="color:#888;">13:30</span> — 如果有人拍下过去2小时，他们会觉得我想要什么？</div>
      <div style="margin-bottom:5px;"><span style="color:#888;">15:15</span> — 我在走向讨厌的生活还是想要的生活？</div>
      <div style="margin-bottom:5px;"><span style="color:#888;">17:00</span> — 我假装不重要的最重要的事是什么？</div>
      <div style="margin-bottom:5px;"><span style="color:#888;">19:30</span> — 今天哪些事是为了保护身份而非真正想要？</div>
      <div style="margin-bottom:15px;"><span style="color:#888;">21:00</span> — 今天什么时候感到最有活力？最死气沉沉？</div>
      
      <div style="color:#fbbf24; font-weight:600; margin-bottom:8px;">通勤/散步/躺着时思考：</div>
      <div style="margin-bottom:4px;">• 如果我不再需要别人视我为[那个身份]，会改变什么？</div>
      <div style="margin-bottom:4px;">• 我在哪里用活力换取安全？</div>
      <div>• 明天可以成为的最小版本的理想自我是什么？</div>
    </div>
  </foreignObject>
  
  <!-- Part 3: 晚上 -->
  <rect x="40" y="1440" width="820" height="360" rx="20" fill="#1c1c2e"/>
  <rect x="40" y="1440" width="8" height="360" rx="4" fill="#6366f1"/>
  <text x="75" y="1485" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#6366f1">🌙 Part 3：晚上 — 整合洞察 + 目标设定</text>
  
  <foreignObject x="75" y="1515" width="760" height="270">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:16px; line-height:1.8; color:#b8b8cc;">
      <div style="margin-bottom:6px;"><span style="color:#6366f1; font-weight:600;">真正的敌人是什么？</span> 不是环境，不是他人，是内在的什么模式/信念？</div>
      <div style="margin-bottom:6px;"><span style="color:#ef4444; font-weight:600;">反愿景一句话：</span> 我绝不让我的人生变成______（读到时应该有感觉）</div>
      <div style="margin-bottom:6px;"><span style="color:#22c55e; font-weight:600;">愿景一句话：</span> 我正在建设的是______（知道它会进化）</div>
      <div style="margin-bottom:6px;"><span style="color:#ffd166; font-weight:600;">1年镜头：</span> 1年后什么变化能证明我打破了旧模式？一件具体的事</div>
      <div style="margin-bottom:6px;"><span style="color:#ffd166; font-weight:600;">1月镜头：</span> 这个月必须发生什么才能让1年目标保持可能？</div>
      <div><span style="color:#ffd166; font-weight:600;">明天行动：</span> 2-3个「那个人」会做的具体事项（加入日程）</div>
    </div>
  </foreignObject>
  
  <rect x="0" y="1830" width="900" height="170" fill="#15152a"/>
  <rect x="40" y="1850" width="820" height="60" rx="12" fill="#232340"/>
  <foreignObject x="75" y="1865" width="760" height="35">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:16px; line-height:1.4; color:#14b8a6; text-align:center; font-weight:600;">
      ⚠️ 不要用AI回答这些问题——目的是突破你思维的限制器
    </div>
  </foreignObject>
  <text x="70" y="1955" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" fill="#666666">来源：Dan Koe · 行为改变的7个核心观点</text>
  <text x="70" y="1985" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#555555">整理 @老章mlpy · 2026年1月</text>
  <rect x="800" y="1930" width="60" height="50" rx="12" fill="#14b8a6" opacity="0.15"/>
  <text x="830" y="1963" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" fill="#14b8a6" font-weight="700" text-anchor="middle">7/8</text>
</svg>
