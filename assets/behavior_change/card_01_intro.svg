<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="1200" fill="url(#bgGrad)"/>
  
  <!-- 装饰元素 -->
  <circle cx="750" cy="150" r="200" fill="#ef4444" opacity="0.06"/>
  <circle cx="150" cy="1050" r="180" fill="#f472b6" opacity="0.04"/>
  <circle cx="850" cy="800" r="120" fill="#fbbf24" opacity="0.05"/>
  
  <!-- 系列标识 -->
  <rect x="40" y="40" width="200" height="36" rx="18" fill="#ef4444" opacity="0.15"/>
  <text x="60" y="65" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#ef4444">🔥 行为改变心理学</text>
  
  <!-- 主标题区 -->
  <foreignObject x="40" y="100" width="820" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:44px; font-weight:800; line-height:1.25; color:#ffffff;">
      为什么新年决心<br/>
      <span style="color:#ef4444;">总是失败？</span>
    </div>
  </foreignObject>
  
  <!-- 副标题 -->
  <text x="40" y="280" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" fill="#888888">7个你可能从未听过的行为改变、心理学与效率观点</text>
  
  <!-- 核心观点卡片 -->
  <rect x="40" y="320" width="820" height="180" rx="20" fill="#1c1c2e"/>
  <rect x="40" y="320" width="8" height="180" rx="4" fill="#ef4444"/>
  <text x="75" y="365" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#ef4444">💡 核心洞察</text>
  <foreignObject x="75" y="380" width="760" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:21px; line-height:1.7; color:#e0e0e0; text-align:justify;">
      大多数人创造新年决心是因为别人都这样做——我们从地位游戏中创造出肤浅的意义——但这些决心<span style="color:#ef4444; font-weight:600;">不符合真正改变的要求</span>，而真正的改变比说服自己今年要更自律深刻得多。
    </div>
  </foreignObject>
  
  <!-- 统计数据 -->
  <rect x="40" y="530" width="260" height="120" rx="16" fill="#232340"/>
  <text x="170" y="580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="48" font-weight="800" fill="#ef4444" text-anchor="middle">92%</text>
  <text x="170" y="620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#888" text-anchor="middle">的新年决心会失败</text>
  
  <rect x="320" y="530" width="260" height="120" rx="16" fill="#232340"/>
  <text x="450" y="580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="48" font-weight="800" fill="#fbbf24" text-anchor="middle">2周</text>
  <text x="450" y="620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#888" text-anchor="middle">是大多数人放弃的时间</text>
  
  <rect x="600" y="530" width="260" height="120" rx="16" fill="#232340"/>
  <text x="730" y="580" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="48" font-weight="800" fill="#22c55e" text-anchor="middle">1天</text>
  <text x="730" y="620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#888" text-anchor="middle">可以重启你的人生</text>
  
  <!-- 作者观点 -->
  <rect x="40" y="680" width="820" height="160" rx="20" fill="#1c1c2e"/>
  <rect x="40" y="680" width="8" height="160" rx="4" fill="#a855f7"/>
  <text x="75" y="725" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#a855f7">✍️ 作者自述</text>
  <foreignObject x="75" y="745" width="760" height="85">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:19px; line-height:1.65; color:#b8b8cc; text-align:justify;">
      我放弃的目标比完成的多10倍。我认为大多数人都应该如此。但人们试图改变生活却几乎每次都彻底失败，这个事实确实成立。
    </div>
  </foreignObject>
  
  <!-- 本系列内容预告 -->
  <rect x="40" y="870" width="820" height="180" rx="20" fill="#232340"/>
  <text x="75" y="915" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#14b8a6">📚 本系列内容</text>
  <foreignObject x="75" y="935" width="760" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:17px; line-height:1.8; color:#888;">
      <span style="color:#ef4444;">❶</span> 身份先于行为 → <span style="color:#a855f7;">❷</span> 目的论 → <span style="color:#f472b6;">❸</span> 身份保护机制<br/>
      <span style="color:#fbbf24;">❹</span> 9层自我发展 → <span style="color:#1a73e8;">❺</span> 智慧与控制论 → <span style="color:#14b8a6;">❻❼</span> 一日协议 → <span style="color:#22c55e;">❽</span> 游戏化人生
    </div>
  </foreignObject>
  
  <!-- 页脚 -->
  <rect x="0" y="1080" width="900" height="120" fill="#15152a"/>
  <text x="70" y="1125" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" fill="#666666">来源：Dan Koe · 行为改变的7个核心观点</text>
  <text x="70" y="1155" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#555555">整理 @老章mlpy · 2026年1月</text>
  <rect x="800" y="1105" width="60" height="50" rx="12" fill="#ef4444" opacity="0.15"/>
  <text x="830" y="1138" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" fill="#ef4444" font-weight="700" text-anchor="middle">1/8</text>
</svg>
