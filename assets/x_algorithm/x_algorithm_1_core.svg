<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="1200" fill="#0f0f1a"/>
  
  <!-- 装饰圆 -->
  <circle cx="800" cy="100" r="150" fill="#1a73e8" opacity="0.08"/>
  <circle cx="100" cy="1100" r="200" fill="#00b4d8" opacity="0.05"/>
  
  <!-- 顶部标签 -->
  <rect x="40" y="40" width="140" height="36" rx="18" fill="url(#headerGrad)"/>
  <text x="110" y="65" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">X 算法揭秘</text>
  
  <!-- 主标题 -->
  <text x="40" y="140" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="42" fill="#ffffff" font-weight="700">X推荐算法的核心逻辑</text>
  <text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="22" fill="#888888">创作者必知的推荐机制</text>
  
  <!-- 核心公式区块 -->
  <rect x="40" y="220" width="820" height="140" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="220" width="6" height="140" rx="3" fill="#ffd166"/>
  <text x="70" y="265" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#ffd166">💡 一句话理解</text>
  <foreignObject x="70" y="280" width="760" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:24px; line-height:1.6; color:#ffffff; font-weight:500;">
      算法预测用户会对你的内容<span style="color:#ffd166;">做什么反应</span>，然后决定是否推荐
    </div>
  </foreignObject>
  
  <!-- 算法逻辑 -->
  <rect x="40" y="390" width="820" height="280" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="390" width="6" height="280" rx="3" fill="#1a73e8"/>
  <text x="70" y="435" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#00b4d8">🧠 算法怎么"想"的</text>
  
  <foreignObject x="70" y="455" width="760" height="200">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:20px; line-height:2.0; color:#b8b8cc;">
      <div style="margin-bottom:8px;"><span style="color:#22c55e; font-weight:600;">✓ 正向预测：</span>用户会点赞、评论、转发、分享</div>
      <div style="margin-bottom:8px;"><span style="color:#ef4444; font-weight:600;">✗ 负向预测：</span>用户会屏蔽、静音、举报</div>
      <div style="margin-bottom:8px;"><span style="color:#ffd166; font-weight:600;">→ 核心公式：</span>正向概率 × 权重 - 负向概率 × 权重</div>
      <div><span style="color:#00b4d8; font-weight:600;">→ 最终结果：</span>得分高的内容优先展示</div>
    </div>
  </foreignObject>
  
  <!-- 内容来源 -->
  <rect x="40" y="700" width="400" height="180" rx="16" fill="#1c1c2e"/>
  <text x="70" y="745" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#a855f7">👥 关注的人</text>
  <foreignObject x="70" y="760" width="350" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:18px; line-height:1.7; color:#b8b8cc;">
      粉丝会优先看到你的内容，但仍需通过算法评分
    </div>
  </foreignObject>
  
  <rect x="460" y="700" width="400" height="180" rx="16" fill="#1c1c2e"/>
  <text x="490" y="745" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#14b8a6">🌍 全网发现</text>
  <foreignObject x="490" y="760" width="350" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:18px; line-height:1.7; color:#b8b8cc;">
      优质内容会被推给陌生人，这是<span style="color:#14b8a6;">破圈</span>的关键！
    </div>
  </foreignObject>
  
  <!-- 关键结论 -->
  <rect x="40" y="910" width="820" height="130" rx="16" fill="#232340"/>
  <rect x="40" y="910" width="6" height="130" rx="3" fill="#22c55e"/>
  <text x="70" y="955" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#22c55e">🎯 关键结论</text>
  <foreignObject x="70" y="970" width="760" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size:22px; line-height:1.5; color:#ffffff; font-weight:500;">
      让更多人<span style="color:#22c55e;">互动</span>，让更少人<span style="color:#ef4444;">反感</span> = 获得更多推荐
    </div>
  </foreignObject>
  
  <!-- 页脚 -->
  <rect x="0" y="1070" width="900" height="130" fill="#15152a"/>
  <text x="40" y="1110" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="16" fill="#666666">来源：X开源推荐算法 x-algorithm</text>
  <text x="40" y="1135" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="14" fill="#888888">github.com/xai-org/x-algorithm</text>
  <text x="860" y="1120" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#666666" text-anchor="end">1/4</text>
</svg>
