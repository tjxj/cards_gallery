<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="1200" fill="#0f0f1a"/>
  
  <!-- Decorative Elements -->
  <circle cx="800" cy="100" r="150" fill="#1a73e8" opacity="0.08"/>
  <circle cx="100" cy="1100" r="200" fill="#00b4d8" opacity="0.05"/>
  
  <!-- Header -->
  <rect x="40" y="40" width="820" height="140" rx="20" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="70" y="95" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="38" font-weight="700" fill="#fff">腾讯元宝战略变阵</text>
  <text x="70" y="140" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="22" fill="#a0c4ff" opacity="0.9">汤道生访谈 · 2025年关键决策</text>
  
  <!-- Card 1: 主动请缨 -->
  <rect x="40" y="210" width="820" height="200" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="210" width="6" height="200" rx="3" fill="url(#accentGrad)"/>
  <text x="70" y="255" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#00b4d8">🙋 主动举手</text>
  <foreignObject x="70" y="270" width="760" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:22px; line-height:1.65; color:#b8b8cc; text-align:justify; word-wrap:break-word;">
      2024年12月，汤道生在休假期间向总办提议：由<span style="color:#00b4d8; font-weight:600;">CSIG接手元宝</span>。他观察到AI Chatbot市场正从技术底层研究，转向前线产品用户的争夺。
    </div>
  </foreignObject>
  
  <!-- Card 2: 两大决策 -->
  <rect x="40" y="430" width="820" height="280" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="430" width="6" height="280" rx="3" fill="#ff6b6b"/>
  <text x="70" y="475" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#ff6b6b">⚡ 春节前两大关键决策</text>
  <foreignObject x="70" y="490" width="760" height="210">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:21px; line-height:1.7; color:#b8b8cc; word-wrap:break-word;">
      <div style="margin-bottom:18px;">
        <span style="color:#ffd166; font-weight:700;">决策一：</span>元宝从TEG划归CSIG，由汤道生率领
        <div style="color:#888; font-size:18px; margin-top:4px;">→ 从技术驱动转向产品驱动</div>
      </div>
      <div>
        <span style="color:#ffd166; font-weight:700;">决策二：</span>在DeepSeek声名大噪之际，接入满血版
        <div style="color:#888; font-size:18px; margin-top:4px;">→ 从只依赖自研模型，转向支持多模型策略</div>
      </div>
    </div>
  </foreignObject>
  
  <!-- Card 3: 决策过程 -->
  <rect x="40" y="730" width="820" height="180" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="730" width="6" height="180" rx="3" fill="#06d6a0"/>
  <text x="70" y="775" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#06d6a0">⏱️ 决策速度</text>
  <foreignObject x="70" y="790" width="760" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:22px; line-height:1.65; color:#b8b8cc; text-align:justify; word-wrap:break-word;">
      接入DeepSeek的决策只用了<span style="color:#06d6a0; font-weight:600;">两三天</span>。Pony把建议扔进小群讨论，总办们价值观一致："以用户需求为本"，没有争议。
    </div>
  </foreignObject>
  
  <!-- Quote Box -->
  <rect x="40" y="930" width="820" height="150" rx="16" fill="#232340"/>
  <rect x="40" y="930" width="6" height="150" rx="3" fill="#ffd166"/>
  <text x="70" y="975" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="40" fill="#ffd166" opacity="0.6">"</text>
  <foreignObject x="95" y="960" width="730" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.6; color:#e0e0e0; font-style:italic; word-wrap:break-word;">
      只要对产品的价值大于包袱的成本，就应该抛开包袱来做对的事儿。
    </div>
  </foreignObject>
  <text x="760" y="1055" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="18" fill="#888">— 汤道生</text>
  
  <!-- Footer -->
  <rect x="40" y="1100" width="820" height="60" rx="12" fill="#15152a"/>
  <text x="70" y="1140" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="16" fill="#666">来源：张小珺对话汤道生访谈 · 2025</text>
  <text x="780" y="1140" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="16" fill="#666" text-anchor="end">1/3</text>
</svg>
