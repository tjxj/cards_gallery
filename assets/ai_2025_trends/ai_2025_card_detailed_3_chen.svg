<svg width="900" height="1380" viewBox="0 0 900 1380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style> text, tspan { font-family: "Hiragino Sans GB", "Heiti SC", sans-serif; } .text-div, .quote-div { font-family: "Early Summer Serif", serif; } 
      .bg { fill: #0f0f12; }
      .card-bg { fill: #1a1a24; stroke: #333; stroke-width: 2; rx: 30; }
      
      .header-role { font-size: 22px; font-weight: 400; fill: #32e0c4; letter-spacing: 1px; }
      .header-name { font-size: 56px; font-weight: 900; fill: #fff; }
      
      .section-box { fill: #202a28; rx: 15; stroke: #333; stroke-width: 1; }
      .section-title { font-size: 26px; font-weight: 700; fill: #fff; }
      
      .highlight { color: #32e0c4; font-weight: 700; }
      .text-div { font-size: 24px; font-weight: 400; color: #ccc; line-height: 1.6; text-align: justify; word-wrap: break-word; }
      
      .quote-bar { fill: #32e0c4; }
      .quote-div { font-size: 28px; font-style: italic; color: #eee; line-height: 1.5; }
      
      .sub-label { font-size: 18px; fill: #666; font-weight: 700; text-transform: uppercase; }
      .footer { font-size: 18px; fill: #444; text-anchor: middle; }
    </style>
  </defs>

  <rect width="900" height="1380" class="bg"/>
  <rect x="40" y="40" width="820" height="1300" class="card-bg"/>

  <!-- Header -->
  <g transform="translate(80, 100)">
    <text x="0" y="0" class="header-role">FREESFUND PARTNER</text>
    <text x="0" y="60" class="header-name">陈石</text>
    <text x="140" y="60" font-size="30" fill="#666" font-weight="400">03 / 商业与落地</text>
    <line x1="0" y1="90" x2="740" y2="90" stroke="#32e0c4" stroke-width="4"/>
  </g>

  <!-- Section 1 (Tight Fit: 250px) -->
  <g transform="translate(80, 240)">
    <text x="0" y="-15" class="sub-label">01 护城河进化</text>
    <rect x="0" y="0" width="740" height="250" class="section-box"/>
    <text x="30" y="45" class="section-title">三层金字塔结构</text>
    
    <foreignObject x="30" y="70" width="680" height="180">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-div">
        底层 (算力)：获取与组织效能，入场门票。<br/>
        中层 (能力)：能否持续维持 <span class="highlight">SOTA</span> 水平。<br/>
        顶层 (<span class="highlight">生态</span>)：最关键。能否触达用户、建立伙伴关系，并形成"应用-数据"的反馈闭环。
      </div>
    </foreignObject>
  </g>

  <!-- Section 2 (Tight Fit: 290px) -->
  <g transform="translate(80, 530)">
    <text x="0" y="-15" class="sub-label">02 谁在买单？</text>
    <rect x="0" y="0" width="740" height="290" class="section-box"/>
    <text x="30" y="45" class="section-title">ToP (To Professional) 率先破局</text>
    
    <foreignObject x="30" y="70" width="680" height="220">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-div">
        ToB (攻坚战)：流程/合规门槛高，仅仅是渗透。<br/>
        ToC (太遥远)：体验未超越APP，且 <span class="highlight">Token成本</span> 高于广告收益，传统流量模式失效。<br/>
        ToP (高价值)：专家型用户/超级个体。如 <span class="highlight">AI Coding</span> 与创作工具。他们愿意为效率付费。
      </div>
    </foreignObject>
  </g>

  <!-- Section 3 (Tight Fit: 210px) -->
  <g transform="translate(80, 860)">
    <text x="0" y="-15" class="sub-label">03 创业心法</text>
    <rect x="0" y="0" width="740" height="210" class="section-box"/>
    <text x="30" y="45" class="section-title">深水区的机会</text>
    
    <foreignObject x="30" y="70" width="680" height="140">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-div">
        不要做太通用的“薄壳”应用。<br/>
        去<span class="highlight">大模型触不到的行业深处</span>。<br/>
        建立能够<span class="highlight">跨越模型迭代周期</span>的商业结构。
      </div>
    </foreignObject>
  </g>

  <!-- Quote -->
  <g transform="translate(80, 1150)">
    <rect x="0" y="0" width="10" height="100" class="quote-bar"/>
    <foreignObject x="35" y="10" width="680" height="100">
      <div xmlns="http://www.w3.org/1999/xhtml" class="quote-div">
        “双核驱动格局已定。中美、开源闭源并行。大模型是赢家通吃的行业，最终全球留不下几家。”
      </div>
    </foreignObject>
  </g>

  <text x="450" y="1300" class="footer">2025 AI 进化论 · 详细深度版</text>
</svg>
