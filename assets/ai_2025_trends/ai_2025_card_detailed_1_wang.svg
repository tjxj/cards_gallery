<svg width="900" height="1410" viewBox="0 0 900 1410" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style> text, tspan { font-family: "Hiragino Sans GB", "Heiti SC", sans-serif; } .text-div, .quote-div { font-family: "Early Summer Serif", serif; } 
      .bg { fill: #0f0f12; }
      .card-bg { fill: #1a1a24; stroke: #333; stroke-width: 2; rx: 30; }
      
      .header-role { font-size: 22px; font-weight: 400; fill: #00d2ff; letter-spacing: 1px; }
      .header-name { font-size: 56px; font-weight: 900; fill: #fff; }
      
      .section-box { fill: #232330; rx: 15; stroke: #333; stroke-width: 1; }
      .section-title { font-size: 26px; font-weight: 700; fill: #fff; }
      
      .highlight { color: #00d2ff; font-weight: 700; }
      .text-div { font-size: 24px; font-weight: 400; color: #ccc; line-height: 1.6; text-align: justify; word-wrap: break-word; }
      
      .quote-bar { fill: #00d2ff; }
      .quote-div { font-size: 28px; font-style: italic; color: #eee; line-height: 1.5; }
      
      .sub-label { font-size: 18px; fill: #666; font-weight: 700; text-transform: uppercase; }
      .footer { font-size: 18px; fill: #444; text-anchor: middle; }
    </style>
  </defs>

  <rect width="900" height="1410" class="bg"/>
  <rect x="40" y="40" width="820" height="1330" class="card-bg"/>

  <!-- Header -->
  <g transform="translate(80, 100)">
    <text x="0" y="0" class="header-role">BEIJING ACADEMY OF AI</text>
    <text x="0" y="60" class="header-name">王仲远</text>
    <text x="200" y="60" font-size="30" fill="#666" font-weight="400">01 / 认知与维度</text>
    <line x1="0" y1="90" x2="740" y2="90" stroke="#00d2ff" stroke-width="4"/>
  </g>

  <!-- Section 1 (Tight Fit: 290px) -->
  <g transform="translate(80, 240)">
    <text x="0" y="-15" class="sub-label">01 趋势判断</text>
    <rect x="0" y="0" width="740" height="290" class="section-box"/>
    <text x="30" y="45" class="section-title">Scaling Law 见顶了吗？</text>
    
    <foreignObject x="30" y="70" width="680" height="220">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-div">
        观点辩证：文本数据的 Scaling Law 确实因枯竭而放缓。<br/><br/>
        新红利点：<span class="highlight">多模态 (Multimodal)</span> 成为新增长极。实证案例：Gemini 3 Pro 与 智源 <span class="highlight">Emu3.5</span> 证明了在视频/图像领域的 Scaling 效应依然强劲，潜力巨大。
      </div>
    </foreignObject>
  </g>

  <!-- Section 2 (Tight Fit: 290px) -->
  <g transform="translate(80, 570)">
    <text x="0" y="-15" class="sub-label">02 核心进化</text>
    <rect x="0" y="0" width="740" height="290" class="section-box"/>
    <text x="30" y="45" class="section-title">从“读万卷书”到“行万里路”</text>
    
    <foreignObject x="30" y="70" width="680" height="220">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-div">
        范式转变：<span class="highlight">Learning from Text ➔ Video</span><br/><br/>
        数据价值：视频数据量级是文本的千倍万倍。其中蕴含的<span class="highlight">时空信息</span>与<span class="highlight">动态交互线索</span>，是模型理解物理世界规律（World Model）的关键底座。
      </div>
    </foreignObject>
  </g>

  <!-- Section 3 (Tight Fit: 220px) -->
  <g transform="translate(80, 900)">
    <text x="0" y="-15" class="sub-label">03 具身智能</text>
    <rect x="0" y="0" width="740" height="220" class="section-box"/>
    <text x="30" y="45" class="section-title">迈向物理世界的“大脑”</text>
    
    <foreignObject x="30" y="70" width="680" height="150">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-div">
        技术路径：<span class="highlight">RoboBrain</span> (具身大脑) 监督小脑学习。<br/><br/>
        预测能力：不仅是生成视频，更是掌握因果律。核心在于 <span class="highlight">Next-State Prediction</span> (下一状态预测)。
      </div>
    </foreignObject>
  </g>

  <!-- Quote -->
  <g transform="translate(80, 1180)">
    <rect x="0" y="0" width="10" height="100" class="quote-bar"/>
    <foreignObject x="35" y="10" width="680" height="100">
      <div xmlns="http://www.w3.org/1999/xhtml" class="quote-div">
        “人工智能正在加速从数字世界迈向物理世界。视频不仅是数据，更是构建‘世界模型’的底座。”
      </div>
    </foreignObject>
  </g>

  <text x="450" y="1330" class="footer">2025 AI 进化论 · 详细深度版</text>
</svg>
