<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="1200" fill="#0f0f1a"/>
  
  <!-- 装饰圆 -->
  <circle cx="800" cy="100" r="150" fill="#ef4444" opacity="0.08"/>
  <circle cx="100" cy="1100" r="200" fill="#f472b6" opacity="0.05"/>
  
  <!-- 顶部标签 -->
  <rect x="40" y="40" width="180" height="36" rx="18" fill="url(#accentGrad)"/>
  <text x="130" y="64" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">中国AI前景</text>
  
  <!-- 页码 -->
  <text x="860" y="64" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#666" text-anchor="end">5/5</text>
  
  <!-- 主标题 -->
  <foreignObject x="40" y="100" width="820" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:36px; line-height:1.3; color:#ffffff; font-weight:700; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      2026：大航海时代的开启？
    </div>
  </foreignObject>
  
  <!-- 三个维度 -->
  <text x="40" y="220" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" font-weight="600" fill="#ffffff">📊 2026年三大关键维度</text>
  
  <!-- 模型基座 -->
  <rect x="40" y="250" width="820" height="145" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="250" width="6" height="145" rx="3" fill="#1a73e8"/>
  
  <text x="70" y="295" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#1a73e8">🏗️ 模型基座</text>
  
  <foreignObject x="70" y="310" width="760" height="75">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:17px; line-height:1.7; color:#b8b8cc; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      国内顶尖大模型与世界一流<span style="color:#22c55e; font-weight:600;">差距已经不大</span>。真正的不确定性在于未来"分叉路口"——硅谷豪赌算力翻倍可能<span style="color:#ef4444;">突然拉大差距</span>。
    </div>
  </foreignObject>
  
  <!-- 企业应用 -->
  <rect x="40" y="415" width="820" height="125" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="415" width="6" height="125" rx="3" fill="#a855f7"/>
  
  <text x="70" y="460" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#a855f7">🏢 企业级应用</text>
  
  <foreignObject x="70" y="475" width="760" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:17px; line-height:1.7; color:#b8b8cc; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      "AI+"已从<span style="color:#ffd166; font-weight:600;">选答题变成必答题</span>。结合业务核心痛点，精准测算ROI，AI可能<span style="color:#a855f7; font-weight:600;">重塑生产力基本面貌</span>。
    </div>
  </foreignObject>
  
  <!-- AI Native -->
  <rect x="40" y="560" width="820" height="145" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="560" width="6" height="145" rx="3" fill="#14b8a6"/>
  
  <text x="70" y="605" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#14b8a6">🚀 AI Native 创业</text>
  
  <foreignObject x="70" y="620" width="760" height="75">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:17px; line-height:1.7; color:#b8b8cc; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      <span style="color:#14b8a6; font-weight:600;">时机已经差不多了</span>。国内基座模型能力已足够支撑各类创新应用。决定房子好不好住的，是创业者的<span style="color:#ffd166;">产品想象力</span>和<span style="color:#ffd166;">工程落地能力</span>。
    </div>
  </foreignObject>
  
  <!-- 理论启发 -->
  <rect x="40" y="730" width="820" height="200" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="730" width="6" height="200" rx="3" fill="#ffd166"/>
  
  <text x="70" y="775" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#ffd166">📚 跨界理论启发</text>
  
  <foreignObject x="70" y="795" width="760" height="125">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:17px; line-height:1.75; color:#b8b8cc; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      <div style="margin-bottom:8px;"><span style="color:#ffd166;">•《思考，快与慢》</span>：为AI进化寻找"形而上"的理论支点</div>
      <div style="margin-bottom:8px;"><span style="color:#ffd166;">•《控制论》</span>：真正的智能体需在开放环境中自我感知、自主决策</div>
      <div><span style="color:#ffd166;">• 系统论与复杂系统理论</span>：探索大模型"涌现"现象的理论武器</div>
    </div>
  </foreignObject>
  
  <!-- 结语引用 -->
  <rect x="40" y="955" width="820" height="100" rx="16" fill="#232340"/>
  <rect x="40" y="955" width="6" height="100" rx="3" fill="#ef4444"/>
  <text x="70" y="995" font-size="36" fill="#ef4444" opacity="0.6" font-family="Georgia, serif">"</text>
  <foreignObject x="95" y="975" width="730" height="65">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.6; color:#e0e0e0; font-style:italic; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      2026年有可能开启一个像移动互联网时代那样百花齐放的<span style="color:#ef4444; font-weight:600;">"大航海时代"</span>。
    </div>
  </foreignObject>
  <text x="780" y="1035" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#888" text-anchor="end">— 孙茂松</text>
  
  <!-- 页脚 -->
  <rect x="0" y="1130" width="900" height="70" fill="#15152a"/>
  <text x="40" y="1165" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#666">来源：高山书院10周年年会访谈</text>
  <text x="860" y="1165" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#666" text-anchor="end">@老章mlpy</text>
</svg>
