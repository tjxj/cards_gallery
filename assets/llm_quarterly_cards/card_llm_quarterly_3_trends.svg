<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="1200" fill="#0f0f1a"/>
  
  <!-- 装饰圆 -->
  <circle cx="820" cy="90" r="140" fill="#14b8a6" opacity="0.08"/>
  <circle cx="80" cy="1100" r="160" fill="#0ea5e9" opacity="0.05"/>
  
  <!-- Header区域 -->
  <rect x="40" y="40" width="820" height="120" rx="16" fill="url(#headerGrad3)" filter="url(#shadow3)"/>
  <text x="70" y="90" font-size="16" fill="#ffffff" opacity="0.8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">全球大模型季报 · 第7集</text>
  <text x="70" y="130" font-size="34" font-weight="700" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">横向全家桶 vs 纵向垂直整合</text>
  
  <!-- 发言人标签 -->
  <rect x="40" y="180" width="120" height="36" rx="18" fill="#14b8a6" opacity="0.2"/>
  <text x="100" y="205" font-size="16" fill="#14b8a6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">李广密</text>
  
  <!-- 横向全家桶区块 -->
  <rect x="40" y="235" width="820" height="200" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="235" width="6" height="200" rx="3" fill="#1a73e8"/>
  <text x="70" y="280" font-size="24" font-weight="600" fill="#1a73e8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">📦 横向全家桶 (ChatGPT)</text>
  
  <foreignObject x="70" y="295" width="760" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:21px; line-height:1.7; color:#b8b8cc; text-align:justify; word-wrap:break-word; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      用户买一个账号就已经包含了 <span style="color:#1a73e8; font-weight:600;">Chat、搜索、Coding、Agent 和 WorkSpace</span>，每月 20 或 200 美元能买到十几个套件。这对做单一垂直能力的套件非常不利，通用模型的全家桶已能满足大众化用户需求。
    </div>
  </foreignObject>
  
  <!-- 纵向垂直整合区块 -->
  <rect x="40" y="455" width="820" height="200" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="455" width="6" height="200" rx="3" fill="#22c55e"/>
  <text x="70" y="500" font-size="24" font-weight="600" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">🔗 纵向垂直整合 (Google)</text>
  
  <foreignObject x="70" y="515" width="760" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:21px; line-height:1.7; color:#b8b8cc; text-align:justify; word-wrap:break-word; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      从 <span style="color:#22c55e; font-weight:600;">TPU芯片 → Gemini模型 → Agent应用 → Google文档 → Chrome → Android → YouTube</span>，做超级集成。就算 Gemini model 落后几个月也没问题，后劲可能是最强的！
    </div>
  </foreignObject>
  
  <!-- C端收敛区块 -->
  <rect x="40" y="675" width="820" height="200" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="675" width="6" height="200" rx="3" fill="#fb923c"/>
  <text x="70" y="720" font-size="24" font-weight="600" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">🎯 C端正在头部收敛</text>
  
  <foreignObject x="70" y="735" width="760" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:21px; line-height:1.7; color:#b8b8cc; text-align:justify; word-wrap:break-word; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      ChatGPT 是<span style="color:#ffd166; font-weight:600;">历史最快到10亿活跃用户</span>的产品。OpenAI ARR <span style="color:#22c55e; font-weight:600;">120亿</span>，Anthropic <span style="color:#22c55e; font-weight:600;">50多亿</span>，再往下是断层。前两名加起来占到了 AI 产品营收的 <span style="color:#ef4444; font-weight:600;">70-80%</span>！
    </div>
  </foreignObject>
  
  <!-- 引用区块 -->
  <rect x="40" y="895" width="820" height="120" rx="16" fill="#232340"/>
  <rect x="40" y="895" width="6" height="120" rx="3" fill="#ffd166"/>
  <text x="70" y="940" font-size="40" fill="#ffd166" opacity="0.6" font-family="Georgia, serif">"</text>
  <foreignObject x="95" y="925" width="730" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:19px; line-height:1.6; color:#e0e0e0; font-style:italic; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      最好的模型，带来最大的流量产品。最好的模型，拿走了最大的价值。
    </div>
  </foreignObject>
  <text x="780" y="995" font-size="16" fill="#888" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">— 李广密</text>
  
  <!-- 页脚 -->
  <rect x="40" y="1025" width="820" height="135" rx="16" fill="#15152a"/>
  <text x="70" y="1070" font-size="18" font-weight="600" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">关键词</text>
  <rect x="70" y="1085" width="80" height="32" rx="16" fill="#1a73e8" opacity="0.2"/>
  <text x="110" y="1107" font-size="14" fill="#1a73e8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">全家桶</text>
  <rect x="160" y="1085" width="100" height="32" rx="16" fill="#22c55e" opacity="0.2"/>
  <text x="210" y="1107" font-size="14" fill="#22c55e" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">垂直整合</text>
  <rect x="270" y="1085" width="100" height="32" rx="16" fill="#fb923c" opacity="0.2"/>
  <text x="320" y="1107" font-size="14" fill="#fb923c" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">头部收敛</text>
  
  <text x="780" y="1140" font-size="16" fill="#666" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">3/6</text>
</svg>
