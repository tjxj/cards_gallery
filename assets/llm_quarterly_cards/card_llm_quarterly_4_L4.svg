<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="1200" fill="#0f0f1a"/>
  
  <!-- 装饰圆 -->
  <circle cx="800" cy="100" r="130" fill="#fb923c" opacity="0.08"/>
  <circle cx="100" cy="1080" r="170" fill="#fbbf24" opacity="0.05"/>
  
  <!-- Header区域 -->
  <rect x="40" y="40" width="820" height="120" rx="16" fill="url(#headerGrad4)" filter="url(#shadow4)"/>
  <text x="70" y="90" font-size="16" fill="#1a1a2e" opacity="0.8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">全球大模型季报 · 第7集</text>
  <text x="70" y="130" font-size="36" font-weight="700" fill="#1a1a2e" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">什么是 L4 级别体验？</text>
  
  <!-- 发言人标签 -->
  <rect x="40" y="180" width="120" height="36" rx="18" fill="#fb923c" opacity="0.2"/>
  <text x="100" y="205" font-size="16" fill="#fb923c" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">李广密</text>
  
  <!-- 定义区块 -->
  <rect x="40" y="235" width="820" height="160" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="235" width="6" height="160" rx="3" fill="#ffd166"/>
  <text x="70" y="280" font-size="24" font-weight="600" fill="#ffd166" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">✨ L4 级别定义</text>
  
  <foreignObject x="70" y="295" width="760" height="90">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:21px; line-height:1.7; color:#b8b8cc; text-align:justify; word-wrap:break-word; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      核心看能在哪个领域率先大规模交付 <span style="color:#ffd166; font-weight:600;">"L4 级别"的体验</span>，就是<span style="color:#fb923c; font-weight:600;">端到端的体会到 Magic moment</span>。只要交付了 L4 级别体验，就会触发商业模式变革。
    </div>
  </foreignObject>
  
  <!-- 两个L4产品 -->
  <rect x="40" y="415" width="400" height="200" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="415" width="6" height="200" rx="3" fill="#1a73e8"/>
  <text x="70" y="460" font-size="22" font-weight="600" fill="#1a73e8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">🔍 Deep Research</text>
  <foreignObject x="70" y="475" width="350" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.6; color:#b8b8cc; word-wrap:break-word; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      ChatGPT 的深度研究能力，对应<span style="color:#1a73e8; font-weight:600;">信息搜索</span>领域。互联网积累了几十年网页数据，是对人类活动最高价值的抽象。
    </div>
  </foreignObject>
  
  <rect x="460" y="415" width="400" height="200" rx="16" fill="#1c1c2e"/>
  <rect x="460" y="415" width="6" height="200" rx="3" fill="#a855f7"/>
  <text x="490" y="460" font-size="22" font-weight="600" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">💻 Claude Code</text>
  <foreignObject x="490" y="475" width="350" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.6; color:#b8b8cc; word-wrap:break-word; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      Anthropic 的编程Agent，对应<span style="color:#a855f7; font-weight:600;">软件开发</span>领域。Github 积累了几十年代码数据，<span style="color:#ffd166; font-weight:600;">90%靠模型，10%靠产品</span>。
    </div>
  </foreignObject>
  
  <!-- 为什么是这两个 -->
  <rect x="40" y="635" width="820" height="180" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="635" width="6" height="180" rx="3" fill="#22c55e"/>
  <text x="70" y="680" font-size="24" font-weight="600" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">❓ 为什么是 Search 和 Coding？</text>
  
  <foreignObject x="70" y="695" width="760" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:21px; line-height:1.7; color:#b8b8cc; text-align:justify; word-wrap:break-word; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      白领工作价值数倍于蓝领，<span style="color:#22c55e; font-weight:600;">程序员工资最高</span>，最容易闭环。在 text 和 code 环境下，更容易给用户交付 L4 级别体验。如果无法在 Coding 做大规模 L4 体验，其他领域肯定更慢。
    </div>
  </foreignObject>
  
  <!-- 商业模式升级 -->
  <rect x="40" y="835" width="820" height="100" rx="16" fill="#232340"/>
  <rect x="40" y="835" width="6" height="100" rx="3" fill="#ef4444"/>
  <foreignObject x="70" y="855" width="760" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:21px; line-height:1.6; color:#e0e0e0; word-wrap:break-word; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      💰 商业模式升级：之前订阅费都是 <span style="color:#888;">$20</span>，现在都愿意付 <span style="color:#22c55e; font-weight:700;">$200</span>！
    </div>
  </foreignObject>
  
  <!-- 引用区块 -->
  <rect x="40" y="955" width="820" height="60" rx="16" fill="#232340"/>
  <foreignObject x="60" y="965" width="780" height="40">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:17px; line-height:1.5; color:#888; font-style:italic; font-family:-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;">
      今天最大红利还是 language 和 code，尤其是 code，还不是多模态、世界模型、机器人。
    </div>
  </foreignObject>
  
  <!-- 页脚 -->
  <rect x="40" y="1025" width="820" height="135" rx="16" fill="#15152a"/>
  <text x="70" y="1070" font-size="18" font-weight="600" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">关键词</text>
  <rect x="70" y="1085" width="80" height="32" rx="16" fill="#ffd166" opacity="0.2"/>
  <text x="110" y="1107" font-size="14" fill="#ffd166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">L4体验</text>
  <rect x="160" y="1085" width="110" height="32" rx="16" fill="#1a73e8" opacity="0.2"/>
  <text x="215" y="1107" font-size="14" fill="#1a73e8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">Deep Research</text>
  <rect x="280" y="1085" width="100" height="32" rx="16" fill="#a855f7" opacity="0.2"/>
  <text x="330" y="1107" font-size="14" fill="#a855f7" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">Claude Code</text>
  
  <text x="780" y="1140" font-size="16" fill="#666" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">4/6</text>
</svg>
