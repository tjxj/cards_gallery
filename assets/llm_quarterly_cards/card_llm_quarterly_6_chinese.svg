  <text x="100" y="205" font-size="16" fill="#22c55e" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif">李广密</text>
  
  <rect x="40" y="235" width="820" height="180" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="235" width="6" height="180" rx="3" fill="#ffd166"/>
  <text x="70" y="280" font-size="24" font-weight="600" fill="#ffd166" font-family="-apple-system, 'PingFang SC', sans-serif">🌏 全球化机遇</text>
  <foreignObject x="70" y="295" width="760" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:21px; line-height:1.7; color:#b8b8cc; text-align:justify; font-family:-apple-system, 'PingFang SC', sans-serif;">
      中国本土市场供给制造能力很强，但内需不够强，容易过度内卷；北美市场供给不充裕，但<span style="color:#22c55e; font-weight:600;">付费需求很强</span>。今天可能是<span style="color:#ffd166; font-weight:600;">华人创业者做全球跨国公司的 timing</span>。
    </div>
  </foreignObject>
  
  <rect x="40" y="435" width="820" height="170" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="435" width="6" height="170" rx="3" fill="#1a73e8"/>
  <text x="70" y="480" font-size="24" font-weight="600" fill="#1a73e8" font-family="-apple-system, 'PingFang SC', sans-serif">💰 投资配置（100块钱）</text>
  <foreignObject x="70" y="495" width="760" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.8; color:#b8b8cc; font-family:-apple-system, 'PingFang SC', sans-serif;">
      <span style="color:#22c55e;">40块</span> OpenAI · <span style="color:#22c55e;">40块</span> 字节 · <span style="color:#ffd166;">10块</span> Anthropic · <span style="color:#ffd166;">10块</span> Google
    </div>
  </foreignObject>
  
  <rect x="40" y="625" width="820" height="200" rx="16" fill="#1c1c2e"/>
  <rect x="40" y="625" width="6" height="200" rx="3" fill="#a855f7"/>
  <text x="70" y="670" font-size="24" font-weight="600" fill="#a855f7" font-family="-apple-system, 'PingFang SC', sans-serif">🎯 非共识观点</text>
  <foreignObject x="70" y="685" width="760" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.7; color:#b8b8cc; font-family:-apple-system, 'PingFang SC', sans-serif;">
      <div style="margin-bottom:8px;">• <span style="color:#a855f7; font-weight:600;">强团队价值被低估</span>：Anthropic、Thinking Machines Lab</div>
      <div style="margin-bottom:8px;">• <span style="color:#22c55e; font-weight:600;">Coding 价值被低估</span>：语言是唯一实现泛化的</div>
      <div>• <span style="color:#ffd166; font-weight:600;">机器人突破</span>可能不由做机器人的团队做出</div>
    </div>
  </foreignObject>
  
  <rect x="40" y="845" width="820" height="100" rx="16" fill="#232340"/>
  <rect x="40" y="845" width="6" height="100" rx="3" fill="#ffd166"/>
  <text x="70" y="885" font-size="36" fill="#ffd166" opacity="0.6">"</text>
  <foreignObject x="95" y="870" width="730" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.5; color:#e0e0e0; font-style:italic; font-family:-apple-system, 'PingFang SC', sans-serif;">
      未来 3-5 年，华人创业者会非常厉害。我们今天要花时间去理解新一代创业者。
    </div>
  </foreignObject>
  <text x="780" y="925" font-size="16" fill="#888" text-anchor="end" font-family="-apple-system, 'PingFang SC', sans-serif">— 李广密</text>
  
