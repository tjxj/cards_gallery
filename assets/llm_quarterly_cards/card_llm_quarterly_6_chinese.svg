      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="#0f0f1a"/>
  <circle cx="800" cy="100" r="130" fill="#22c55e" opacity="0.08"/>
  <circle cx="100" cy="1080" r="170" fill="#4ade80" opacity="0.05"/>
  
  <rect x="40" y="40" width="820" height="120" rx="16" fill="url(#headerGrad6)"/>
  <text x="70" y="90" font-size="16" fill="#0f0f1a" opacity="0.8" font-family="-apple-system, 'PingFang SC', sans-serif">全球大模型季报 · 第7集</text>
  <text x="70" y="130" font-size="36" font-weight="700" fill="#0f0f1a" font-family="-apple-system, 'PingFang SC', sans-serif">犹太人的金融，华人的AGI</text>
  
