<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style> text, tspan { font-family: "Hiragino Sans GB", "Heiti SC", sans-serif; } .text-div, .quote-div { font-family: "Early Summer Serif", serif; } 
      .bg { fill: #0f0f12; }
      .card-bg { fill: #1a1a24; stroke: #333; stroke-width: 2; rx: 30; }
      
      .header-role { font-size: 22px; font-weight: 400; fill: #2979ff; letter-spacing: 1px; }
      .header-name { font-size: 56px; font-weight: 900; fill: #fff; }
      
      .section-box { fill: #232330; rx: 15; stroke: #333; stroke-width: 1; }
      .section-title { font-size: 26px; font-weight: 700; fill: #fff; }
      
      .highlight { color: #2979ff; font-weight: 700; }
      .text-div { font-size: 24px; font-weight: 400; color: #ccc; line-height: 1.6; text-align: justify; word-wrap: break-word; }
      
      .quote-bar { fill: #2979ff; }
      .quote-div { font-size: 26px; font-style: italic; color: #eee; line-height: 1.5; }
      
      .sub-label { font-size: 18px; fill: #666; font-weight: 700; text-transform: uppercase; }
      .footer { font-size: 18px; fill: #444; text-anchor: middle; }
    </style>
  </defs>

  <rect width="900" height="1200" class="bg"/>
  <rect x="40" y="40" width="820" height="1120" class="card-bg"/>

  <!-- Header -->
  <g transform="translate(80, 100)">
    <text x="0" y="0" class="header-role">METAX SVP</text>
    <text x="0" y="60" class="header-name">孙国梁</text>
    <text x="200" y="60" font-size="30" fill="#666" font-weight="400">算力与稳态</text>
    <line x1="0" y1="90" x2="740" y2="90" stroke="#2979ff" stroke-width="4"/>
  </g>

  <!-- Section 1 -->
  <g transform="translate(80, 230)">
    <text x="0" y="-15" class="sub-label">01 架构之争</text>
    <rect x="0" y="0" width="740" height="210" class="section-box"/>
    <text x="30" y="45" class="section-title">GPU 与 ASIC 的超级稳态</text>
    
    <foreignObject x="30" y="70" width="680" height="140">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-div">
        在当前模型高速迭代（按周/月更新）的阶段，GPU 的<span class="highlight">通用性</span>是最大优势。ASIC 难以适配处于剧烈变化中的通用场景。
      </div>
    </foreignObject>
  </g>

  <!-- Section 2 -->
  <g transform="translate(80, 480)">
    <text x="0" y="-15" class="sub-label">02 工程反推</text>
    <rect x="0" y="0" width="740" height="170" class="section-box"/>
    <text x="30" y="45" class="section-title">暴力尝试的必要性</text>
    
    <foreignObject x="30" y="70" width="680" height="100">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-div">
        现在的 AI 是用<span class="highlight">工程学</span>在“反推”基础科学。在数学原理突破前，必须靠 GPU 进行大量的工程尝试。
      </div>
    </foreignObject>
  </g>

  <!-- Section 3 -->
  <g transform="translate(80, 690)">
    <text x="0" y="-15" class="sub-label">03 市场视角</text>
    <rect x="0" y="0" width="740" height="170" class="section-box"/>
    <text x="30" y="45" class="section-title">华尔街的“砍价方式”</text>
    
    <foreignObject x="30" y="70" width="680" height="100">
      <div xmlns="http://www.w3.org/1999/xhtml" class="text-div">
        英伟达市值的波动可能只是资本市场的博弈。在当前历史阶段，通用性算力仍是绝对的主流。
      </div>
    </foreignObject>
  </g>

  <!-- Quote -->
  <g transform="translate(80, 930)">
    <rect x="0" y="0" width="10" height="100" class="quote-bar"/>
    <foreignObject x="35" y="10" width="680" height="100">
      <div xmlns="http://www.w3.org/1999/xhtml" class="quote-div">
        “现在的AI是用工程学在‘反推’基础科学。在数学和脑科学原理突破之前，我们需要靠GPU做大量的工程尝试。”
      </div>
    </foreignObject>
  </g>

  <text x="450" y="1100" class="footer">AI 基础设施圆桌 · 2025</text>
</svg>
