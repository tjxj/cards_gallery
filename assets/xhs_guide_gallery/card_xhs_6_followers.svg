<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2185b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="#0f0f1a"/>
  <circle cx="820" cy="100" r="110" fill="#e91e63" opacity="0.08"/>
  <rect x="40" y="40" width="160" height="36" rx="18" fill="url(#headerGrad)"/>
  <text x="120" y="65" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">小红书商业化</text>
  <text x="860" y="65" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" fill="#666" text-anchor="end">6/9</text>
  <text x="40" y="130" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="38" fill="#ffffff" font-weight="700">涨粉核心：给用户关注理由</text>
  <foreignObject x="40" y="145" width="820" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.5; color:#888888;">用户不是为了"有用"，是为了"稀缺"</div>
  </foreignObject>
  <rect x="40" y="210" width="820" height="200" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="210" width="6" height="200" rx="3" fill="#e91e63"/>
  <text x="70" y="255" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#e91e63" font-weight="600">🚗 案例1：特斯拉验车清单</text>
  <foreignObject x="70" y="270" width="760" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify;">市场传言特斯拉做工差，车主有恐慌。做了验车清单PDF：A4版本+移动端版本。<span style="color:#e91e63; font-weight:600;">这个清单帮他涨了大部分粉丝</span>。用户可能拿到也不会看，但能达到转化目的。</div>
  </foreignObject>
  <rect x="40" y="430" width="820" height="180" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="430" width="6" height="180" rx="3" fill="#3498db"/>
  <text x="70" y="475" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#3498db" font-weight="600">🤖 案例2：AI工具多维表格</text>
  <foreignObject x="70" y="490" width="760" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify;">把用过的所有AI工具做成多维表格。用子视图引流，如讲可灵时展示"国产视频模型"视图。<span style="color:#3498db; font-weight:600;">给用户一个关注你的理由：我这有你需要的东西</span>。</div>
  </foreignObject>
  <rect x="40" y="630" width="820" height="170" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="630" width="6" height="170" rx="3" fill="#27ae60"/>
  <text x="70" y="675" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#27ae60" font-weight="600">📊 巧妙的正向循环</text>
  <foreignObject x="70" y="690" width="760" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify;">用语雀多维表格收集车主数据。几百条数据后，<span style="color:#27ae60; font-weight:600;">表格本身又变成引流素材</span>。进来的人越多，数据越多，引流效果越好！</div>
  </foreignObject>
  <rect x="40" y="820" width="820" height="180" rx="16" fill="#232340"/>
  <rect x="40" y="820" width="6" height="180" rx="3" fill="#f39c12"/>
  <text x="70" y="860" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" fill="#f39c12" font-weight="600">⚠️ 绕过平台限制的技巧</text>
  <foreignObject x="70" y="875" width="760" height="115">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:17px; line-height:1.6; color:#b8b8cc;">• 不能贴二维码、不能口播账号、不能放网址<br/>• 说"小红书不让发"，把链接打码或消音<br/>• 先引到小红书群，群里限制没那么大<br/>• 建群→发链接置顶→设置欢迎语引导</div>
  </foreignObject>
  <rect x="0" y="1080" width="900" height="120" fill="#15152a"/>
  <text x="40" y="1120" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#666">来源：向阳乔木 | 小红书接广告完全指南</text>
  <text x="40" y="1145" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#666">分享嘉宾：陈言（Linkc_Chen）| 10万粉AI博主</text>
  <text x="40" y="1170" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#555">zhangAI 知识卡片 · 2025-12-31</text>
</svg>
