<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="#0f0f1a"/>
  <circle cx="800" cy="100" r="120" fill="#2ecc71" opacity="0.08"/>
  <rect x="40" y="40" width="160" height="36" rx="18" fill="url(#headerGrad)"/>
  <text x="120" y="65" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">小红书商业化</text>
  <text x="860" y="65" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" fill="#666" text-anchor="end">7/9</text>
  <text x="40" y="130" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="38" fill="#ffffff" font-weight="700">商业化的三个阶段</text>
  <foreignObject x="40" y="145" width="820" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.5; color:#888888;">代理必选 → 品牌直合 → 多元破局</div>
  </foreignObject>
  <rect x="40" y="210" width="820" height="210" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="210" width="6" height="210" rx="3" fill="#2ecc71"/>
  <text x="70" y="255" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#2ecc71" font-weight="600">🥇 第一阶段：进入代理公司必选名单</text>
  <foreignObject x="70" y="270" width="760" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify;">品牌方投放广告，基本都是代理公司去对接博主。目标：<span style="color:#2ecc71; font-weight:600;">每次投放必须有我，至少进前五</span>。<br/><br/>代理公司最喜欢的博主：数据稳定、人设清晰、配合度高。</div>
  </foreignObject>
  <rect x="40" y="440" width="820" height="210" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="440" width="6" height="210" rx="3" fill="#3498db"/>
  <text x="70" y="485" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#3498db" font-weight="600">🤝 第二阶段：和品牌方直接合作</text>
  <foreignObject x="70" y="500" width="760" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify;">代理公司返点40%-50%，越来越过分。目标：<span style="color:#3498db; font-weight:600;">和主要品牌方建联，直接拿订单</span>。<br/><br/>参加品牌方活动，和产品经理、工程师聊天，提前了解产品。不让中间商赚差价，内容质量会更高。</div>
  </foreignObject>
  <rect x="40" y="670" width="820" height="210" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="670" width="6" height="210" rx="3" fill="#9b59b6"/>
  <text x="70" y="715" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#9b59b6" font-weight="600">🌈 第三阶段：多元化，不被限制</text>
  <foreignObject x="70" y="730" width="760" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify;">陈言的焦虑：如果未来AI发展不太好，大家都不投了，市场就没了。目标：<span style="color:#9b59b6; font-weight:600;">把AI内容降到一半，扩展到智能硬件和汽车</span>。<br/><br/>虽然会丢掉一些收入，但让账号更多元化，长期稳定性更好。</div>
  </foreignObject>
  <rect x="40" y="900" width="820" height="110" rx="16" fill="#232340"/>
  <rect x="40" y="900" width="6" height="110" rx="3" fill="#ffd166"/>
  <text x="70" y="945" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="40" fill="#ffd166" opacity="0.6">"</text>
  <foreignObject x="95" y="930" width="730" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:19px; line-height:1.5; color:#e0e0e0; font-style:italic;">跟着自己的感觉和爱好来</div>
  </foreignObject>
  <text x="760" y="990" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" fill="#888" text-anchor="end">— 陈言</text>
  <rect x="0" y="1080" width="900" height="120" fill="#15152a"/>
  <text x="40" y="1120" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#666">来源：向阳乔木 | 小红书接广告完全指南</text>
  <text x="40" y="1145" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#666">分享嘉宾：陈言（Linkc_Chen）| 10万粉AI博主</text>
  <text x="40" y="1170" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#555">zhangAI 知识卡片 · 2025-12-31</text>
</svg>
