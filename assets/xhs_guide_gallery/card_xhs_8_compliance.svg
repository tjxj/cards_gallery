<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="#0f0f1a"/>
  <circle cx="800" cy="100" r="120" fill="#e74c3c" opacity="0.08"/>
  <rect x="40" y="40" width="160" height="36" rx="18" fill="url(#headerGrad)"/>
  <text x="120" y="65" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">小红书商业化</text>
  <text x="860" y="65" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" fill="#666" text-anchor="end">8/9</text>
  <text x="40" y="130" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="38" fill="#ffffff" font-weight="700">合规的三个雷区</text>
  <foreignObject x="40" y="145" width="820" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.5; color:#888888;">玄学改兴趣，医疗禁疗效，金融禁推荐</div>
  </foreignObject>
  <rect x="40" y="210" width="820" height="210" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="210" width="6" height="210" rx="3" fill="#9b59b6"/>
  <text x="70" y="255" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#9b59b6" font-weight="600">🔮 雷区1：玄学类——把算命讲成兴趣</text>
  <foreignObject x="70" y="270" width="760" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify;">算命属于迷信，但讲塔罗牌就变成兴趣。陈言做过一个ChatGPT算命的爆款，被限流过。<br/><br/><span style="color:#9b59b6; font-weight:600;">改成"教大家怎么写提示词，举的例子是算命"</span>。主题改了，但内容还是算命，还能吃到占卜的流量。</div>
  </foreignObject>
  <rect x="40" y="440" width="820" height="210" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="440" width="6" height="210" rx="3" fill="#e74c3c"/>
  <text x="70" y="485" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#e74c3c" font-weight="600">💊 雷区2：医疗类——不能说疗效药名</text>
  <foreignObject x="70" y="500" width="760" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify;">没有医生资质：<br/>• <span style="color:#e74c3c; font-weight:600;">不能说东西有疗效</span><br/>• 不能告诉大家什么病应该怎么治<br/>• 不能有药物名字，尤其是处方药<br/><br/>症状名字可以有，建议改成俗称（如带状疱疹→"龙缠腰"）</div>
  </foreignObject>
  <rect x="40" y="670" width="820" height="210" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="670" width="6" height="210" rx="3" fill="#f39c12"/>
  <text x="70" y="715" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#f39c12" font-weight="600">📈 雷区3：金融类——不能推荐投资品</text>
  <foreignObject x="70" y="730" width="760" height="140">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify;"><span style="color:#f39c12; font-weight:600;">不能推荐买什么投资品</span>（股票、期货、证券、基金）<br/><br/>不能在金融类内容里讲违背经济发展的情况。陈言踩过坑：说"现在的楼市很不景气"，删了这句就过了。<span style="color:#888;">这种一阵一阵的，有时候紧有时候松，看运气。</span></div>
  </foreignObject>
  <rect x="40" y="900" width="820" height="110" rx="16" fill="#232340"/>
  <rect x="40" y="900" width="6" height="110" rx="3" fill="#ffd166"/>
  <text x="70" y="945" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="40" fill="#ffd166" opacity="0.6">💡</text>
  <foreignObject x="110" y="930" width="700" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:19px; line-height:1.5; color:#e0e0e0;">核心技巧：换个主题包装，保留实际内容</div>
  </foreignObject>
  <rect x="0" y="1080" width="900" height="120" fill="#15152a"/>
  <text x="40" y="1120" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#666">来源：向阳乔木 | 小红书接广告完全指南</text>
  <text x="40" y="1145" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#666">分享嘉宾：陈言（Linkc_Chen）| 10万粉AI博主</text>
  <text x="40" y="1170" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#555">zhangAI 知识卡片 · 2025-12-31</text>
</svg>
