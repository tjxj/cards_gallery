<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="#0f0f1a"/>
  <circle cx="800" cy="100" r="120" fill="#1abc9c" opacity="0.08"/>
  <circle cx="100" cy="1100" r="150" fill="#16a085" opacity="0.05"/>
  <rect x="40" y="40" width="160" height="36" rx="18" fill="url(#headerGrad)"/>
  <text x="120" y="65" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">小红书商业化</text>
  <text x="860" y="65" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" fill="#666" text-anchor="end">9/9</text>
  <text x="40" y="130" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="38" fill="#ffffff" font-weight="700">图文还是视频？</text>
  <foreignObject x="40" y="145" width="820" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.5; color:#888888;">视频为主，图文为辅，长尾并重</div>
  </foreignObject>
  <rect x="40" y="210" width="820" height="180" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="210" width="6" height="180" rx="3" fill="#e74c3c"/>
  <text x="70" y="255" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#e74c3c" font-weight="600">🎬 视频：流量主力</text>
  <foreignObject x="70" y="270" width="760" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify;">小红书的流量<span style="color:#e74c3c; font-weight:600;">一定是向视频倾斜的</span>，因为平台要和其他平台争夺用户的访问时长。视频更容易获得即时流量和推荐。</div>
  </foreignObject>
  <rect x="40" y="410" width="820" height="180" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="410" width="6" height="180" rx="3" fill="#3498db"/>
  <text x="70" y="455" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#3498db" font-weight="600">📝 图文：长尾优势</text>
  <foreignObject x="70" y="470" width="760" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify;">图文在小红书也有流量，是<span style="color:#3498db; font-weight:600;">长尾流量</span>。图文笔记的搜索流量、长尾流量要比视频高。只要选题不是时效性特别强的，图文基本上是持续有流量的。</div>
  </foreignObject>
  <rect x="40" y="610" width="820" height="160" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="610" width="6" height="160" rx="3" fill="#27ae60"/>
  <text x="70" y="655" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#27ae60" font-weight="600">✅ 最佳策略</text>
  <foreignObject x="70" y="670" width="760" height="90">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify;"><span style="color:#27ae60; font-weight:600;">视频为主，图文为辅</span>。小红书没有特别明确的界限说你是图文号还是视频号。你偶尔发个视频，也不会不给你推荐。</div>
  </foreignObject>
  <rect x="40" y="790" width="820" height="210" rx="16" fill="#232340"/>
  <rect x="40" y="790" width="6" height="210" rx="3" fill="#ffd166"/>
  <text x="70" y="830" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" fill="#ffd166" font-weight="600">📌 写在最后：记住这几点</text>
  <foreignObject x="70" y="845" width="760" height="145">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:17px; line-height:1.6; color:#b8b8cc;">• 定位：想清楚谁是用户，谁是客户<br/>• 内容：给广告留空间，日常=广告<br/>• 冷启动：最小成本验证方向<br/>• 涨粉：给用户关注理由（稀缺资源）<br/>• 封面：AI做夸张但真实的场景<br/><span style="color:#ffd166; font-weight:600;">关键：别犹豫，先做起来再说！</span></div>
  </foreignObject>
  <rect x="0" y="1080" width="900" height="120" fill="#15152a"/>
  <text x="40" y="1120" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#666">来源：向阳乔木 | 小红书接广告完全指南</text>
  <text x="40" y="1145" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" fill="#666">分享嘉宾：陈言（Linkc_Chen）| 10万粉AI博主</text>
  <text x="40" y="1170" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#555">zhangAI 知识卡片 · 2025-12-31</text>
</svg>
