<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="1200" fill="#0f0f1a"/>
  
  <!-- 装饰圆 -->
  <circle cx="800" cy="100" r="130" fill="#1abc9c" opacity="0.08"/>
  <circle cx="80" cy="1100" r="160" fill="#16a085" opacity="0.05"/>
  
  <!-- 顶部标签 -->
  <rect x="40" y="40" width="160" height="36" rx="18" fill="url(#headerGrad)"/>
  <text x="120" y="65" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">小红书商业化</text>
  
  <!-- 页码 -->
  <text x="860" y="65" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#666" text-anchor="end">3/9</text>
  
  <!-- 主标题 -->
  <text x="40" y="130" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="38" fill="#ffffff" font-weight="700">冷启动的三个关键动作</text>
  
  <!-- 副标题 -->
  <foreignObject x="40" y="145" width="820" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:18px; line-height:1.5; color:#888888;">
      用产品思维，最小成本验证方向
    </div>
  </foreignObject>
  
  <!-- 动作1：最小成本验证 -->
  <rect x="40" y="210" width="820" height="220" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="210" width="6" height="220" rx="3" fill="#1abc9c"/>
  <text x="70" y="255" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" fill="#1abc9c" font-weight="600">🧪 用最小成本验证方向</text>
  <foreignObject x="70" y="270" width="760" height="150">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify; word-wrap:break-word;">
      陈言同时计划做3个账号：汽车、AI、亲子。不确定哪个能做起来，<span style="color:#1abc9c; font-weight:600;">同时发内容，看哪个数据好</span>。结果AI账号在小红书数据最稳定，点赞几十，对新账号来说很不错。于是停了另外两个，专注做AI。很多人做账号一上来就all in，做了三个月发现不行，浪费大量时间。
    </div>
  </foreignObject>
  
  <!-- 动作2：差异化定位 -->
  <rect x="40" y="450" width="820" height="220" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="450" width="6" height="220" rx="3" fill="#3498db"/>
  <text x="70" y="495" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" fill="#3498db" font-weight="600">🎯 找到你的差异化定位</text>
  <foreignObject x="70" y="510" width="760" height="150">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify; word-wrap:break-word;">
      画一个两象限图：横轴是AI账号方向（整活、讲技术、科普、讲工具），纵轴是账号体量和竞争力。把所有能看到的AI账号标上去，找空白地带。陈言找到的定位：<span style="color:#3498db; font-weight:600;">AI场景实验室</span>——在公司项目里怎么用AI、和女儿怎么用AI、做自媒体怎么用AI。所有内容都有场景，场景和人设强相关。
    </div>
  </foreignObject>
  
  <!-- 动作3：抄爆款 -->
  <rect x="40" y="690" width="820" height="200" rx="16" fill="#1c1c2e" filter="url(#shadow)"/>
  <rect x="40" y="690" width="6" height="200" rx="3" fill="#e74c3c"/>
  <text x="70" y="735" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" fill="#e74c3c" font-weight="600">📋 前50条内容可以抄</text>
  <foreignObject x="70" y="750" width="760" height="130">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.65; color:#b8b8cc; text-align:justify; word-wrap:break-word;">
      起号阶段，先别考虑原创，去抄爆款。原创成本太高，不知道什么内容会火。<span style="color:#e74c3c; font-weight:600;">找一个爆款，原封不动地复制</span>。推荐算法的底层逻辑：一旦有人验证了某个爆点，你就可以重复这个过程。大方向定下来了，先抄起来再说！
    </div>
  </foreignObject>
  
  <!-- 金句 -->
  <rect x="40" y="910" width="820" height="120" rx="16" fill="#232340"/>
  <rect x="40" y="910" width="6" height="120" rx="3" fill="#ffd166"/>
  <text x="70" y="955" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="40" fill="#ffd166" opacity="0.6">"</text>
  <foreignObject x="95" y="940" width="730" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:20px; line-height:1.6; color:#e0e0e0; font-style:italic;">
      不要觉得抄不好意思，大方向定下来了，先抄起来再说。
    </div>
  </foreignObject>
  <text x="760" y="1010" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" fill="#888" text-anchor="end">— 陈言</text>
  
  <!-- 页脚 -->
  <rect x="0" y="1080" width="900" height="120" fill="#15152a"/>
  <text x="40" y="1120" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#666">来源：向阳乔木 | 小红书接广告完全指南</text>
  <text x="40" y="1145" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#666">分享嘉宾：陈言（Linkc_Chen）| 10万粉AI博主</text>
  <text x="40" y="1170" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#555">zhangAI 知识卡片 · 2025-12-31</text>
</svg>
